אֲשֶׁר קִדְּשָׁנוּ לְהַדְלִיק נֵר שֶׁל שַׁבָּת`},practica:{titulo:"Luz con cavaná",dias:[{dia:"Día 1",accion:"Compra velas de cera de abeja. Tócalas. Huele."},{dia:"Día 2",accion:"18 minutos antes de la puesta de sol, apaga todas las luces eléctricas."},{dia:"Día 3",accion:"Enciende 2 velas. Cubre tus ojos 20 segundos. Pide en silencio 3 deseos."},{dia:"Día 4",accion:"Enciende aunque estés solo/sola. Di la berajá aunque tiembles."},{dia:"Día 5",accion:"Deja que las velas se consuman sin apagarlas. Mira cómo cambia tu cara."},{dia:"Día 6",accion:"Viernes: invita a alguien a encender contigo. Luz compartida."},{dia:"Día 7",accion:"Escribe qué luz encendiste esta semana que no existía antes."}]},color:"#FBE8A6"},{id:3,num:"03",hebreo:"קידוש",hebreoNikud:"קִדּוּשׁ",translit:"Kiddush",titulo:"Santificar",tituloHeb:"Kiddush",subtitulo:"קידוש",tagline:"Santificar es separar con palabra y vino. Decir: este tiempo es distinto.",abierta:"Santificar es separar con palabra y vino. Decir: este tiempo es distinto. No es mejor ni peor. Es otro. El Kiddush no bendice el vino: usa el vino para bendecir el tiempo. Lo tomas con la mano derecha, lleno hasta derramar. Porque la alegría, para guardar el tiempo, tiene que desbordar un poco. De noche es deoraitá, de día es derabanán. Pero los dos dicen lo mismo: hoy no es continuación de ayer.",profunda:{texto:"Zajor et Yom HaShabat Lekadshó – Shemot 20:8. Recuerda. El verbo zajor es activo. No es memoria pasiva, es hacer memorable. El vino es alegría que guarda, no que olvida. Por eso Kiddush de noche incluye Vayejulu – testimonio de la creación. Y Kiddush de día incluye Veshamru – testimonio de la salida de Egipto. Un Shabat guarda el mundo, el otro te guarda a ti. Beber sin bendecir es tomar. Bendecir y luego beber es santificar. La diferencia es una palabra en medio.",fuentes:["Shemot 20:8 – Zajor et Yom HaShabat","Pesajim 106a – Kiddush Hayom","Rambam, Hiljot Shabat 29:1"],hebreoFuente:`זָכוֹר אֶת יוֹם הַשַּׁבָּת לְקַדְּשׁוֹ
וַיְכֻלּוּ הַשָּׁמַיִם וְהָאָרֶץ`},practica:{titulo:"Copa, pan, tiempo",dias:[{dia:"Día 1",accion:"Consigue una copa que solo uses para Kiddush. Que tenga peso."},{dia:"Día 2",accion:"Llena la copa hasta que casi derrame. Mira el borde."},{dia:"Día 3",accion:"Di Vayejulu en voz alta, de pie. Aunque estés solo."},{dia:"Día 4",accion:"Kiddush con pan delante cubierto. Dos panes. Lechem Mishné."},{dia:"Día 5",accion:"Bebe sentado. De un trago pequeño. No a sorbos."},{dia:"Día 6",accion:"Viernes noche: Kiddush completo con alguien, compartiendo la misma copa."},{dia:"Día 7",accion:"Kiddush de día: más corto, más dulce. ¿Qué tiempo distinto estás marcando?"}]},color:"#D6C6F5"},{id:4,num:"04",hebreo:"סעודה ועונג",hebreoNikud:"סְעוּדָּה וְעֹנֶג",translit:"Seudá veOneg",titulo:"Mesa",tituloHeb:"Seudá y Oneg",subtitulo:"סעודה ועונג",tagline:"Comer sin apuro. Shabat tiene 3 seudot. El placer es mitzvá, no culpa.",abierta:"Comer sin apuro. Shabat tiene tres seudot, no por hambre, sino por ritmo. Viernes noche, Shabat mañana, Seudá Shlishit al atardecer. Cada una con su luz distinta. El placer es mitzvá, no culpa. Oneg no es lujo, es atención. Partir el pan despacio, cantar zemirot aunque desafines, dejar que la comida sea oración sin palabras. Aquí el estómago también reza.",profunda:{texto:"VeKarata LaShabat Oneg – Yeshaya 58:13. Y llamarás al Shabat deleite. El Talmud (Shabat 118a) dice: todo el que deleita el Shabat recibe herencia sin límites. Lechem Mishné: dos panes en recuerdo del doble maná que caía viernes. No es magia, es memoria encarnada. Zemirot no son canciones de sobremesa, son Tikún para la seudá, para que no sea solo ingesta. Comer en Shabat es avodá – servicio. El Arizal decía que las chispas más altas están en la comida de Shabat porque se comen sin ansiedad.",fuentes:["Yeshaya 58:13 – Oneg Shabat","Shabat 118a – Kol Hameoneg","Arizal – Shaar HaKavanot, Seudot Shabat"],hebreoFuente:`וְקָרָאתָ לַשַּׁבָּת עֹנֶג
לֶחֶם מִשְׁנֶה – זֵכֶר לַמָּן`},practica:{titulo:"Mesa sin prisa",dias:[{dia:"Día 1",accion:"Compra jalá trenzada. Si no hay, trenza pan común."},{dia:"Día 2",accion:"Una comida sin celular a la vista. Celular en otro cuarto."},{dia:"Día 3",accion:"Canta un zemer. Shalom Alejem. Aunque solo tararees."},{dia:"Día 4",accion:"Sirve 3 platos pequeños en lugar de 1 grande. Ritmo."},{dia:"Día 5",accion:"Come con la mano no dominante 2 minutos. Atención."},{dia:"Día 6",accion:"Viernes noche: mesa con mantel blanco, invita."},{dia:"Día 7",accion:"Seudá Shlishit: al atardecer, solo pan, aceituna y silencio."}]},color:"#C8E6D5"},{id:5,num:"05",hebreo:"מנוחה",hebreoNikud:"מְנוּחָה",translit:"Menujá",titulo:"Descanso radical",tituloHeb:"Menujá",subtitulo:"מנוחה",tagline:"Descanso no es no hacer nada. Es dejar de producir.",abierta:"Descanso no es no hacer nada. Es dejar de producir. Las 39 melajot no son prohibiciones: son 39 formas de no intervenir el mundo. No sembrar, no cosechar, no escribir, no encender fuego. No porque el trabajo sea malo, sino porque necesitas un día donde el mundo siga sin ti. Aquí Shabat toca directamente el Bloque 6 de Adam Adamá – Trabajo. Si no paras, el trabajo te define. Si paras, te recuerdas.",profunda:{texto:"Shemot 20:10 – Lemaán Yanúaj Avdejaj Vaamatejá... Kaamoja. Para que descanse tu siervo, tu buey y tu extranjero como tú. No es privilegio, es derecho. El descanso es la primera ley laboral de la Torá. Rambam dice: Menujá no es ausencia de trabajo, es presencia de sistema que se mantiene solo. Por eso Shabat no es vacaciones. Vacaciones cambian de lugar. Shabat cambia de modo. De hacer a ser. De crear a contemplar. En tiempos de burnout, Menujá es desobediencia sagrada.",fuentes:["Shemot 20:10 – Kaamoja","Rambam, More Nevujim II:31 – Taamei HaShabat","Abraham J. Heschel – The Sabbath, Menujá como arquitectura del tiempo"],hebreoFuente:`לְמַעַן יָנוּחַ עַבְדְּךָ וַאֲמָתְךָ כָּמוֹךָ
שֵׁשֶׁת יָמִים תַּעֲבֹד – וּבַיּוֹם הַשְּׁבִיעִי תִּשְׁבֹּת`},practica:{titulo:"25 horas sin crear",dias:[{dia:"Día 1",accion:"Haz lista de lo que NO harás: comprar, crear, producir, optimizar."},{dia:"Día 2",accion:"Haz lista de lo que SÍ harás: caminar, leer por placer, amar, dormir."},{dia:"Día 3",accion:"Deja el celular cargando en otra habitación de puesta de sol a puesta de sol."},{dia:"Día 4",accion:"Camina sin audífonos 30 min. Sin contar pasos."},{dia:"Día 5",accion:"Lee un libro de papel que no te sirva para nada."},{dia:"Día 6",accion:"25 horas reales: de viernes atardecer a sábado noche. Sin comprar."},{dia:"Día 7",accion:"Escribe: ¿Qué parte de ti descansa cuando no produces?"}]},color:"#FFD4D0"},{id:6,num:"06",hebreo:"הבדלה",hebreoNikud:"הַבְדָּלָה",translit:"Havdalá",titulo:"Separar",tituloHeb:"Havdalá",subtitulo:"הבדלה",tagline:"Salir también es sagrado. Vino, especias y fuego para llevarte el aroma.",abierta:"Salir también es sagrado. Havdalá no es cierre, es costura. Vino, especias y fuego para llevarte el aroma de Shabat a la semana. Hueles las besamim porque se va el alma extra – neshamá yeterá – y necesitas consuelo. Miras la llama entre tus dedos para aprender de nuevo a crear fuego. Separar es también un arte. No todo lo sagrado dura para siempre. Algunas cosas hay que despedirlas con belleza para que vuelvan.",profunda:{texto:"Berajá: Hamavdil Ben Kodesh Lejol, Ben Or Lejoshej, Ben Israel Laamim, Ben Yom Hashevií Lesheshet Yemei Hamaasé. El que separa. Cinco separaciones en una. Besamim para el alma extra que se va – según Talmud Betzá 16a, en Shabat recibes una neshamá adicional que te hace ver más claro. Cuando se va, quedas triste, por eso olemos perfume. Ner: vuelves a crear fuego, vuelves a ser socio de la creación. Después de 25 horas de no crear, encender la mecha es volver a decir: el mundo te necesita otra vez.",fuentes:["Talmud Betzá 16a – Neshamá Yeterá","Berajot 8a – Hamavdil","Rav Kook – Olat Reiyá, Havdalá como esperanza"],hebreoFuente:`הַמַּבְדִּיל בֵּין קֹדֶשׁ לְחוֹל
בֵּין אוֹר לְחֹשֶׁךְ – בְּשָׂמִים לִנְשָׁמָה יְתֵרָה`},practica:{titulo:"Aroma para la semana",dias:[{dia:"Día 1",accion:"Consigue besamim: clavo, canela, romero. Guárdalos en cajita."},{dia:"Día 2",accion:"Sábado noche: copa de vino, especias, vela trenzada con 2 mechas."},{dia:"Día 3",accion:"Mira la sombra de tus dedos a la luz de Havdalá. Cuenta tus líneas."},{dia:"Día 4",accion:"Huele las besamim 3 veces profundo. ¿A qué te recuerda?"},{dia:"Día 5",accion:'Di: "Que esta semana tenga algo del perfume de Shabat".'},{dia:"Día 6",accion:"Havdalá con alguien. Compartan deseos para la semana."},{dia:"Día 7",accion:"Guarda un resto de cera de la vela Havdalá en tu bolsillo toda la semana."}]},color:"#DDE6FF"}];function ei(){let[e,n]=ue.useState(0),[t,r]=ue.useState(""),[l,o]=ue.useState(null),[u,i]=ue.useState("abierta"),[s,f]=ue.useState(new Set([1,2])),[v,h]=ue.useState(!1),[m,k]=ue.useState(!1),[S,_]=ue.useState(""),R=[100,120,140,160];ue.useEffect(()=>{try{let p=localStorage.getItem("derej-shabat-scale");if(p){let C=R.indexOf(Number(p));if(C!==-1)n(C)}}catch{}},[]),ue.useEffect(()=>{document.documentElement.style.setProperty("--text-scale",`${R[e]}%`);try{localStorage.setItem("derej-shabat-scale",String(R[e]))}catch{}},[e]);let c=ue.useMemo(()=>Rl.find((p)=>p.id===l)||null,[l]),a=ue.useMemo(()=>{if(!t.trim())return Rl;let p=t.toLowerCase();return Rl.filter((C)=>C.titulo.toLowerCase().includes(p)||C.translit.toLowerCase().includes(p)||C.hebreo.includes(t)||C.tagline.toLowerCase().includes(p)||C.subtitulo.toLowerCase().includes(p))},[t]),d=s.size/6*100,w=()=>n((p)=>(p+1)%R.length),N=(p)=>{o(p),i("abierta"),f((C)=>{let D=new Set(C);return D.add(p),D}),window.scrollTo({top:0,behavior:"smooth"})},z=(p)=>{let C=`SHABAT / ${p.tituloHeb} – ${p.hebreo}
