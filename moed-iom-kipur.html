que encuentres tu letra, sin drama.","LECTURA DÉREJ: cuando te ves con claridad, ya no necesitas sostener una máscara. El reconocimiento abre espacio para volver."],hebrewText:{he:"אָשַׁמְנוּ, בָּגַדְנוּ, גָּזַלְנוּ, דִּבַּרְנוּ דֹּפִי",translit:"Ashamnu, Bagadnu, Gazalnu, Dibarnu Dofi",meaning:"Hemos fallado, hemos traicionado, hemos robado, hemos hablado con duplicidad. El plural te sostiene."}},practica:{prompt:"Escribir en privado qué reconoces. Sin justificar, sin explicar contexto todavía. Solo nombrar.",placeholders:["Reconozco que yo...","Lo que dejé de hacer fue...","Si miro con honestidad, mi parte fue..."]},conexion:[{label:"Adam Adamá → Ver la tierra que pisaste",to:"adam"},{label:"Hitbodedut → Hablarlo a solas",to:"escucha"}]},{id:2,he:"תשובה",heVoweled:"תְּשׁוּבָה",translit:"Teshuvá",title:"Del reconocimiento al cambio",subtitle:"Volver y cambiar dirección. No solo sentir, sino girar.",keywords:["cambio","retorno","dirección","mañana"],color:"#9B8E7D",abierta:{intro:"Reconocer tu falta es importante, pero teshuvá no termina ahí. Teshuvá busca volver y cambiar dirección.",body:["Yejezkel dice: 'Convertíos y apartaos de todas vuestras transgresiones' (18:30). No dice 'sientan culpa'. Dice: giren el cuerpo.","Teshuvá no es prometer perfección desde hoy. Es imaginar de forma concreta qué harás diferente mañana, cuando vuelva a pasar.","No necesitas un plan de 10 pasos. Necesitas una escena: la próxima vez que..."],pregunta:"Si volviera a pasar mañana, ¿qué te gustaría hacer diferente, aunque sea en un 10%?"},profunda:{sources:[{ref:"Yejezkel 18:30",text:"שׁוּבוּ וְהָשִׁיבוּ מִכָּל־פִּשְׁעֵיכֶם",comment:"Vuelvan y apártense de todas sus transgresiones. La teshuvá es un retorno activo."},{ref:"Yeshayahu 55:7",text:"יַעֲזֹב רָשָׁע דַּרְכּוֹ וְאִישׁ אָוֶן מַחְשְׁבֹתָיו וְיָשׁוּב אֶל־יְהוָה",comment:"Deje el impío su camino y el hombre inicuo sus pensamientos, y vuélvase a Adonai. Dejar camino + dejar pensamiento + volver."},{ref:"PARÁFRASIS · Sfat Emet · Haazinu",text:"Shuv no es volver atrás, es volver a tu punto de origen en Dios",comment:"No vuelves a quien eras antes de fallar. Vuelves a quien eres cuando estás cerca de Él."},{ref:"PARÁFRASIS · Noam Elimelej",text:"Cambiar no es prometer ser perfecto, es imaginar concreto qué harás diferente mañana",comment:"El tzadik no hace votos grandilocuentes. Describe la próxima escena."}],teaching:["La teshuvá tiene futuro. Si solo miras el pasado, es culpa. Si miras el mañana, es retorno.","Por eso en esta ficha trabajamos con una frase concreta, tuya, en primera persona. Dios no necesita poesía. Necesita verdad encarnada."],extra:"Dios, reconozco que necesito cambiar ___, si vuelvo a enfrentarme a esta situación, ayúdame a ___"},practica:{prompt:"Visualización concreta de la próxima situación similar. Escribe en presente, como si ya estuviera pasando.",placeholders:["Dios, reconozco que necesito cambiar...","Si vuelvo a enfrentarme a esto, ayúdame a...","Mañana, en lugar de..., voy a intentar..."],prayerTemplate:"Dios, reconozco que necesito cambiar ___, si vuelvo a enfrentarme a esta situación, ayúdame a ___"},conexion:[{label:"Moed → Yamim Noraim",to:"moed"},{label:"Shabat → Menujá",to:"shabat"}]},{id:3,he:"בין אדם לחברו",heVoweled:"בֵּין אָדָם לַחֲבֵרוֹ",translit:"Bein Adam LeJaveró",title:"Entre tú y esa persona",subtitle:"Iom Kipur no perdona lo que es entre personas hasta que reparas.",keywords:["reparación","perdón","daño","responsabilidad"],color:"#B0896A",abierta:{intro:"Iom Kipur distingue con claridad brutal: entre tú y Dios, y entre tú y esa persona.",body:["No es solo ¿me arrepiento de corazón? sino ¿qué puedo hacer para reparar el daño que causé?","El arrepentimiento sin reparación es espiritualidad bonita. La Torá pide compensación entera. Cuerpo, no solo lágrimas.","No necesitas decirme quién es. Pero sí necesitas preguntarte: ¿qué hice? ¿qué daño produjo? ¿qué puedo hacer concretamente para repararlo?"],pregunta:"Si esa persona pudiera escuchar una verdad sin defensa de tu parte, ¿cuál sería?"},profunda:{sources:[{ref:"Bemidbar 5:7",text:"וְהִתְוַדּוּ אֶת־חַטָּאתָם אֲשֶׁר עָשׂוּ וְהֵשִׁיב אֶת־אֲשָׁמוֹ בְּרֹאשׁוֹ",comment:"Confesarán su pecado que hicieron y compensarán enteramente su culpa. Primero confesar, luego restituir el capital."},{ref:"Rambam, Hiljot Teshuvá 2:9",text:"אין יום הכפורים מכפר על עבירות שבין אדם לחברו עד שירצה את חברו",comment:"Iom Kipur no expía las transgresiones entre persona y prójimo hasta que apacigüe a su prójimo. El cielo no puede firmar lo que el prójimo no ha perdonado."},{ref:"PARÁFRASIS · Kedushat Levi",text:"Pedir perdón sin 'pero' es el principio de la reparación",comment:"En el momento que dices 'perdón, pero tú...' ya dejaste de pedir perdón. Empezaste a defenderte."}],teaching:["Una reparación sincera evita la justificación, asume la propia parte y busca una forma concreta de reparar cuando sea posible.","No todas las reparaciones son posibles. Algunas personas ya no están, algunas situaciones no se pueden deshacer. Entonces la reparación se hace con otros, en el mismo tipo de daño."],extra:"Reconozco que te hice daño cuando ___. No estuvo bien. Lo lamento y te pido perdón. Quiero reparar lo que hice y procurar no repetirlo."},practica:{prompt:"Tres preguntas que no se pueden saltear. Escríbelas lento.",placeholders:["¿Qué hice concretamente? (hecho, no intención)","¿Qué daño produjo en esa persona? (en su confianza, tiempo, dignidad)","¿Qué puedo hacer concretamente para repararlo? (no solo decir perdón)"],prayerTemplate:"Reconozco que te hice daño cuando ___. No estuvo bien. Lo lamento y te pido perdón. Quiero reparar lo que hice y procurar no repetirlo."},conexion:[{label:"Adam Adamá → Hashavat Aveidá",to:"adam"},{label:"Adam Adamá → Maaké",to:"adam"}]},{id:4,he:"הפצע",heVoweled:"הַפֶּצַע",translit:"HaPetza",title:"La herida que todavía llevas",subtitle:"Cambiar la mirada: de lo que fallaste a lo que cargaste.",keywords:["herida","dolor","sanar","trauma","soltar"],color:"#8C7A6B",abierta:{intro:"Hay otra cara de Iom Kipur que nadie nombra: no solo lo que hiciste mal, sino lo que te hicieron y aún duele.",body:["¿Hay alguien que te hirió profundamente y esa herida sigue gobernando cómo confías, cómo amas, cómo te paras?","Sanar no es olvidar. No es decir 'no pasó nada'. Es que la herida deje de ser el jefe de tu corazón.","Perdonar, reconciliarse y volver a confiar no son lo mismo. Cada proceso tiene tiempos, condiciones y límites distintos."],pregunta:"Si tuvieras que ponerle nombre a lo que se quebró en ti — confianza, dignidad, tranquilidad, inocencia — ¿cuál sería?"},profunda:{sources:[{ref:"Yirmiyahu 17:14",text:"רְפָאֵנִי יְהוָה וְאֵרָפֵא הוֹשִׁיעֵנִי וְאִוָּשֵׁעָה",comment:"Sáname, YHWH, y sanaré; sálvame, y estaré a salvo. La plegaria pone la esperanza de sanación en Dios."},{ref:"LECTURA DÉREJ · inspirada en Rabí Najman",text:"Sanar no es olvidar, es que la herida no gobierne tu corazón",comment:"El olvido forzado es otra violencia. La sanación es que el recuerdo ya no dicte tu reacción."},{ref:"LECTURA DÉREJ · tradición jasídica",text:"Soltar no es dejar caer. Es dejar de apretar",comment:"Tu mano está cansada de sostener ese dolor como prueba de que pasó. Puedes abrirla."}],teaching:["Esta oración no niega el dolor ni apura el perdón. Pide libertad interior, no amnesia.","Iom Kipur también puede abrir un espacio para que la herida no defina toda tu identidad. Eso no niega lo ocurrido ni obliga a perdonar, reconciliarse o volver a confiar."],extra:"Dios, Tú sabes lo que ocurrió... No quiero negar mi dolor, pero tampoco quiero que esta herida gobierne mi corazón... Muéstrame qué necesito para seguir viviendo con verdad y cuidado..."},practica:{prompt:"Identifica qué perdiste o se quebró en ti. Sin apurar el perdón.",placeholders:["Lo que se quebró en mí fue mi...","Desde entonces, me cuesta...","Lo que necesito para que esta herida no gobierne es..."],prayerTemplate:"Dios, Tú sabes lo que ocurrió... No quiero negar mi dolor, pero tampoco quiero que esta herida gobierne mi corazón... Muéstrame qué necesito para seguir viviendo con verdad y cuidado..."},conexion:[{label:"Escucha → Hitbodedut",to:"escucha"},{label:"Shabat → Menujá",to:"shabat"}]},{id:5,he:"גבולות",heVoweled:"גְּבוּלוֹת",translit:"Gvulot",title:"Perdonar, reconciliarse y poner límites",subtitle:"Tres caminos distintos. No confundirlos es sabiduría.",keywords:["límites","perdón","reconciliación","baranda","sabiduría"],color:"#A78A7A",abierta:{intro:"Enseñanza delicada y necesaria: perdonar es interior, reconciliarse depende de dos, y poner límites es sabiduría.",body:["Perdonar, si llega a ser parte de tu proceso, no obliga a volver a confiar como antes. Mantener un límite seguro no es venganza.","Puedes querer reconciliarte y que la otra persona no quiera. No puedes obligar. La reconciliación es un baile de dos.","Y puedes poner límites, hayas perdonado o no. El límite no es castigo: puede ser una forma de cuidado."],pregunta:"En esa historia que cargas, ¿qué parte corresponde a tu proceso interior, qué parte requeriría reconciliación de dos y qué parte necesita un límite de protección?"},profunda:{sources:[{ref:"LECTURA DÉREJ · sobre perdón y límites",text:"Perdonar no equivale a restaurar automáticamente la confianza",comment:"LECTURA DÉREJ: la limpieza interior no obliga a volver al mismo vínculo ni al mismo nivel de confianza."},{ref:"LECTURA DÉREJ · sobre cuidado y límites",text:"A veces amar al otro es poner distancia, para no volver a caer los dos",comment:"El amor sin límite se vuelve permisividad que daña a ambos."},{ref:"Devarim 22:8 - Maaké",text:"וְעָשִׂיתָ מַעֲקֶה לְגַגֶּךָ",comment:"Harás una baranda para tu techo. Tu techo — tu casa interior — necesita baranda para que nadie caiga, ni tú. Límite es mitzvá, no frialdad."}],teaching:["Maaké es una de las mitzvot más pastorales: Dios te dice 'cuida tu techo'. Si alguien se cae de tu falta de límite, también es tu responsabilidad.","El perdón no exige ingenuidad ni exposición al daño; los límites también pueden ser parte de la libertad."]},practica:{prompt:"Distingue con honestidad las tres dimensiones. No las mezcles.",placeholders:["Perdonar para mí significa aquí...","Reconciliarme significaría... ¿es posible? ¿lo quiero?","El límite necesario para cuidarme y cuidar es... (concreto: tiempo, temas, frecuencia, lugar)"]},conexion:[{label:"Adam Adamá → Maaké",to:"adam"},{label:"Moed → Límites santos",to:"moed"}]},{id:6,he:"הכרת הטוב",heVoweled:"הַכָּרַת הַטּוֹב",translit:"Hakarat HaTov",title:"Reconocer el bien",subtitle:"A pesar de las dificultades, ¿qué bien puedes reconocer?",keywords:["gratitud","bien","esposo","familia","reconocer"],color:"#C9B896",abierta:{intro:"Iom Kipur no termina en pecado. Termina en bien. Después de vaciarte, tienes que llenarte de gratitud.",body:["A pesar de las dificultades, ¿qué bien concreto puedes agradecer a Dios este año?","Hakarat HaTov no es positivismo barato. Es entrenamiento del ojo para ver lo que sostuvo tu vida cuando tú no podías.","Hakarat HaTov invita a reconocer el bien concreto, no sólo de manera general: no sólo «gracias por mi familia», sino «gracias por…»."],pregunta:"Si tuvieras que elegir un bien concreto que Dios puso en tu vida este año, que si no hubiera estado te habrías caído, ¿cuál es?"},profunda:{sources:[{ref:"Tehilim 136:1",text:"הוֹדוּ לַיהוָה כִּי־טוֹב כִּי לְעוֹלָם חַסְדּוֹ",comment:"Dad gracias a YHWH porque es bueno, porque para siempre es su misericordia. La gratitud como reconocimiento de bondad esencial, no circunstancial."},{ref:"LECTURA DÉREJ · Hakarat HaTov",text:"Reconocer un bien concreto en otra persona puede convertirse en avodá, no sólo en cortesía",comment:"Decir gracias genérico es fácil. Nombrar el acto concreto — 'gracias porque cuando... tú...' — es ver al otro de verdad."},{ref:"LECTURA DÉREJ · tradición jasídica",text:"La gratitud es en sí misma teshuvá",comment:"Cuando agradeces, vuelves a tu fuente. Ya no estás quejándote del mundo, estás volviendo a Quien lo sostiene."}],teaching:["Una oración de Hakarat HaTov no idealiza ni niega dificultades: elige reconocer el bien concreto.","Gratitud no es negar dolor. Es no dejar que el dolor sea lo único que narre tu año."],extra:"Adonai, hoy quiero darte gracias por... Gracias por el bien concreto que recibí cuando... Gracias porque, aun en lo difícil..."},practica:{prompt:"Identifica persona y bien concreto. Escríbelo como si fuera una carta que sí entregarías.",placeholders:["Hoy quiero dar gracias por...","El bien concreto que hizo y me sostuvo fue cuando...","Gracias por haber permitido que..."],prayerTemplate:"Adonai, hoy quiero darte gracias por... Gracias por el bien concreto que recibí cuando..."},conexion:[{label:"Adam Adamá → Reconocer al otro",to:"adam"},{label:"Shabat → Oneg",to:"shabat"}]},{id:7,he:"ענווה",heVoweled:"עֲנָוָה",translit:"Anavá",title:"Humildad y Devoción",subtitle:"No necesito que me vean. Dios conoce mi corazón.",keywords:["ego","humildad","devoción","oculto","fidelidad"],color:"#B5A89A",abierta:{intro:"Todo Tishrei te preguntó lo mismo: ¿para quién haces lo que haces?",body:["Esta es una práctica de Tishrei: «No necesito que me vean. Dios conoce mi corazón».","Vayikrá 22:32 dice: 'Yo soy YHWH que os santifico'. No dice 'vosotros os santificáis a fuerza de logro'. Dios es quien santifica, no tu performance.","Shabat es la escuela de humildad por excelencia: un día entero donde el mundo no depende de mí. Y sigue funcionando. Qué alivio."],pregunta:"¿En qué área de tu vida haces cosas buenas pero todavía buscas reconocimiento? ¿Qué pasaría si nadie se enterara?"},profunda:{sources:[{ref:"Vayikrá 22:32",text:"וְלֹא תְחַלְּלוּ אֶת־שֵׁם קָדְשִׁי וְנִקְדַּשְׁתִּי בְּתוֹךְ בְּנֵי יִשְׂרָאֵל אֲנִי יְהוָה מְקַדִּשְׁכֶם",comment:"Y no profanaréis mi Santo Nombre, y seré santificado en medio de los hijos de Israel; Yo soy YHWH que os santifico. La santidad no es auto-producida."},{ref:"LECTURA DÉREJ · santidad y ego",text:"El ego espiritual es el último velo antes de la santidad",comment:"Hacer mucho por Dios pero necesitando que todos lo sepan es todavía hacerlo por ti."},{ref:"LECTURA DÉREJ · servicio en ocultamiento",text:"Haz una acción buena que nadie sepa, y tendrás un secreto con Dios",comment:"Un secreto compartido solo con Él es intimidad, no marketing."},{ref:"Vayikrá 23:3 - Shabat",text:"שַׁבָּת שַׁבָּתוֹן",comment:"Shabat como entrenamiento semanal de 'yo no soy imprescindible'."}],teaching:["Estas frases pueden funcionar como tefilá: no como autoayuda, sino como reorientación del corazón.","Humildad no es pensar menos de ti. Es pensar menos en ti."],extra:"No necesito reconocimiento; necesito fidelidad. / Menos necesidad de aprobación; más libertad para servir. / Adonai, Tú lo viste. Eso basta."},practica:{prompt:"Una acción buena que nadie sepa. 10 minutos de no hacer. Uno menos (una cosa que dejas de hacer para no figurar).",placeholders:["Hoy voy a hacer en oculto...","Voy a dejar de hacer durante 10 min...","Mi frase para llevar es: Adonai, Tú lo viste. Eso basta."],prayerTemplate:"No necesito reconocimiento; necesito fidelidad. Menos necesidad de aprobación; más libertad para servir."},conexion:[{label:"Shabat → Menujá",to:"shabat"},{label:"Adam Adamá → Humildad",to:"adam"}]},{id:8,he:"נעילה",heVoweled:"נְעִילָה",translit:"Neila",title:"El cierre que abre",subtitle:"Neila - puertas que se cierran y corazón que se abre.",keywords:["cierre","apertura","shofar","cotidiano","después"],color:"#D6C7B0",abierta:{intro:"Neila es el momento más dramático: las puertas se están cerrando. ¿Qué alcanzas a meter por la rendija?",body:["No es apuro. Es claridad. Cuando sabes que se cierra, por fin sabes qué es esencial.","¿Cómo vivir mañana lo que hoy prometiste? Esa es la pregunta de Neila. No qué sentiste en ayuno, sino qué harás desayunando.","El shofar final no es fin de fiesta. Es inicio de vida cotidiana santificada."],pregunta:"Si esta Neila fuera la última oportunidad de decirle a Dios qué qui
