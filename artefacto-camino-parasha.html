sin hacer",detalle:"Al despertar, siéntate junto a una ventana sin celular. Mira la luz entrar 10 minutos. No rezar, no producir. Solo dejar que la luz te vea.",tiempo:"10 min · oculta"},tefila:"Ribono shel Olam, haz de mis ojos vasijas para Tu luz primera. Que no corra a arreglar el mundo antes de dejar que me ilumine.",frase:"No necesitas alumbrar todo. Solo deja que tu luz exista.",temasAdam:["Conservar","Fundamentos"]},{id:2,parasha:"Bereshit",parashaHeb:"בראשית",aliyah:2,aliyahRef:"Bereshit 1:9-14",hebrewDate:"25 de Tishrei 5787",gregDate:"18 oct 2026",title:"El Agua que Sabe Separarse",hineniHeb:"הִנְנִי מַיִם",hineni:"Aquí estoy, hecha de aguas revueltas. Sepárame por dentro, no para dividirme, sino para que pueda respirar.",lectura:"וַיֹּאמֶר אֱלֹהִים יִקָּווּ הַמַּיִם מִתַּחַת הַשָּׁמַיִם אֶל־מָקוֹם אֶחָד וְתֵרָאֶה הַיַּבָּשָׁה (1:9) — Que las aguas se junten en un lugar y aparezca lo seco.",contexto:"Segunda aliyá: Dios no crea agua nueva, la reúne. El acto de juntar es creación. Hebcal enseña que este es el primer límite amoroso: sin separación, no hay mundo habitable.",versiculoCentralHeb:"יִקָּווּ הַמַּיִם אֶל־מָקוֹם אֶחָד",versiculoCentralEsp:"Júntense las aguas en un lugar.",versiculoRef:"Bereshit 1:9",fuente:"Sfat Emet",ensenanzaTitulo:"El secreto de la reunión",ensenanza:"El Sfat Emet (Bereshit 5631) dice: 'Yikavú' viene de 'kav', esperanza. Las aguas esperan juntas. Cuando tus emociones se juntan en un solo lugar -en el corazón- y no se desbordan por todos lados, entonces aparece la tierra firme donde puedes pararte y sembrar.",citaJasidica:"Sfat Emet Bereshit 5631 — 'La reunión de las aguas es la reunión del corazón disperso'.",conexionAdam:{portal:"Adam Adamá",ficha:"Agua y Árbol #8",verso:"Mayim Hayim",desc:"Aprender a contener agua es aprender a contener la vida."},examen:["¿Qué emoción hoy se está desbordando y necesita un lugar?","¿Estoy poniendo límites para cuidar o para controlar?"],accion:{titulo:"Un recipiente para el agua",detalle:"Hoy no te quejes del agua. Cada vez que abras la canilla, bendice en silencio: 'Gracias por el límite que me sostiene'. Cierra 10 segundos antes.",tiempo:"todo el día · oculto"},tefila:"Haz de mi corazón una costa, no un dique. Que sepa juntar sin ahogar.",frase:"Poner límites también es un acto de creación.",temasAdam:["Agua","Conservar"]},{id:3,parasha:"Bereshit",parashaHeb:"בראשית",aliyah:3,aliyahRef:"Bereshit 1:15-23",hebrewDate:"26 de Tishrei 5787",gregDate:"19 oct 2026",title:"Luminarias para Contar",hineniHeb:"הִנְנִי לִרְאוֹת",hineni:"Aquí estoy, aprendiendo a medir el tiempo no con prisa, sino con lunas.",lectura:"וַיַּעַשׂ אֱלֹהִים אֶת־שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים... וְהָיוּ לְאֹתֹת וּלְמוֹעֲדִים (1:16,14) — Para señales y para tiempos sagrados.",contexto:"Tercera aliyá: sol, luna y estrellas no son para alumbrar más, sino para marcar moed. Aquí nace el calendario judío. Sin luminarias no hay fiesta.",versiculoCentralHeb:"וְהָיוּ לְאֹתֹת וּלְמוֹעֲדִים",versiculoCentralEsp:"Y sean por señales y por tiempos señalados.",versiculoRef:"Bereshit 1:14",fuente:"Or HaChaim",ensenanzaTitulo:"El tiempo no es lineal",ensenanza:"Or HaChaim Hakadosh enseña que 'leotot' — señales — significa que cada fase lunar es una carta que Dios te escribe. La luna mengua para enseñarte que decrecer no es fracasar. Es parte del pacto con el tiempo.",citaJasidica:"Or HaChaim 1:14 — 'Dios colgó el tiempo en el cielo para que el hombre no lo cargue en la espalda'.",conexionAdam:{portal:"Moed",ficha:"Luna #2",verso:"Moedim",desc:"Volver a mirar la luna es volver a pertenecer al ciclo."},examen:["¿Mido mi valor por cuánto produzco al día o por a qué ritmo vivo?","¿Cuándo fue la última vez que miré la luna sin fotografiarla?"],accion:{titulo:"Mirar la luna esta noche",detalle:"Sal 2 minutos esta noche a buscar la luna. No la compartas. Solo di: 'Hineni bajo la misma luna de Bereshit'.",tiempo:"2 min · noche"},tefila:"Enséñame a contar mis días por lunas, no solo por pendientes.",frase:"Menguar también es sagrado.",temasAdam:["Luna","Moed"]},{id:4,parasha:"Bereshit",parashaHeb:"בראשית",aliyah:4,aliyahRef:"Bereshit 1:24-2:3",hebrewDate:"27 de Tishrei 5787",gregDate:"20 oct 2026",title:"Adam y el Séptimo Día",hineniHeb:"הִנְנִי נוֹחַ",hineni:"Aquí estoy, cansada de hacer. Enséñame a ser imagen, no solo herramienta.",lectura:"וַיִּבְרָא אֱלֹהִים אֶת־הָאָדָם בְּצַלְמוֹ... וַיְבָרֶךְ אֹתָם... וַיִּשְׁבֹּת בַּיּוֹם הַשְּׁבִיעִי (1:27, 2:2)",contexto:"Cuarta aliyá: creación del humano y del Shabat el mismo bloque. El humano nace casi en Shabat, para entender que no vino a terminar el mundo, sino a habitarlo.",versiculoCentralHeb:"וַיִּשְׁבֹּת בַּיּוֹם הַשְּׁבִיעִי",versiculoCentralEsp:"Y cesó en el día séptimo.",versiculoRef:"Bereshit 2:2",fuente:"Sfat Emet",ensenanzaTitulo:"Shabat es la raíz",ensenanza:"El Sfat Emet dice: Shabat no es el premio después del trabajo. Es la raíz de la que sale el trabajo. El que no guarda Shabat, trabaja desde la ansiedad. El que sí, trabaja desde el descanso.",citaJasidica:"Sfat Emet Bereshit 5633 — 'Shabat es el alma de toda la semana'.",conexionAdam:{portal:"Shabat",ficha:"Shabat #1 - Menujá",verso:"Vayishbot",desc:"Cesar es la forma más alta de crear."},examen:["¿Puedo parar sin sentir culpa?","¿Mi hacer nace del descanso o del miedo a no ser vista?"],accion:{titulo:"Un Shabat de 10 minutos",detalle:"Hoy elige 10 minutos donde no arreglas, no respondes, no mejoras. Te sientas y dices: 'el mundo está bien sin mí por 10 minutos'.",tiempo:"10 min"},tefila:"Que mi cesar no sea rendición, sino confianza.",frase:"No viniste a terminar el mundo.",temasAdam:["Shabat","Humildad"]},{id:5,parasha:"Bereshit",parashaHeb:"בראשית",aliyah:5,aliyahRef:"Bereshit 2:4-19",hebrewDate:"28 de Tishrei 5787",gregDate:"21 oct 2026",title:"L'ovda Uleshomra",hineniHeb:"הִנְנִי לְעָבְדָהּ וּלְשָׁמְרָהּ",hineni:"Aquí estoy para servir y para guardar. No para usar la tierra, sino para casarme con ella.",lectura:"וַיִּקַּח יְהוָה אֱלֹהִים אֶת־הָאָדָם וַיַּנִּחֵהוּ בְגַן־עֵדֶן לְעָבְדָהּ וּלְשָׁמְרָהּ (2:15)",contexto:"Quinta aliyá: segundo relato de la creación. Adam no es dueño, es jardinero. Hebcal conecta este verso con el Día de la Tierra judío. Es el mandamiento ecológico original.",versiculoCentralHeb:"לְעָבְדָהּ וּלְשָׁמְרָהּ",versiculoCentralEsp:"Para trabajarla y para cuidarla.",versiculoRef:"Bereshit 2:15",fuente:"Baal Shem Tov",ensenanzaTitulo:"Servir es rezar",ensenanza:"El Besht enseñaba que 'leovda' también significa 'servir' como en avodá - plegaria. Cuando riegas una planta con kavana, estás rezando. El jardín es tu sidur.",citaJasidica:"Degel Majané Efraim Bereshit — 'Todo servicio a la creación con amor es servicio al Creador'.",conexionAdam:{portal:"Adam Adamá",ficha:"Fundamentos #2 - L'ovda Uleshomra",verso:"2:15",desc:"El núcleo de todo Dérej: trabajar y guardar son un solo verbo."},examen:["¿En qué lugar de mi vida solo uso y no cuido?","¿Qué parte de mi tierra interior está pidiendo agua hoy?"],accion:{titulo:"Una acción de guarda oculta",detalle:"Hoy haz una acción de cuidado ambiental que nadie vea: levanta basura que no es tuya, riega una planta ajena, no compres algo. Sin contarlo.",tiempo:"1 acción · oculta"},tefila:"Que mis manos aprendan a guardar lo que mi boca dice amar.",frase:"Cuidar es una forma de oración.",temasAdam:["Conservar","Preservar","Tierra"]},{id:6,parasha:"Bereshit",parashaHeb:"בראשית",aliyah:6,aliyahRef:"Bereshit 2:20-3:21",hebrewDate:"29 de Tishrei 5787",gregDate:"22 oct 2026",title:"El Árbol y el Límite",hineniHeb:"הִנְנִי בְּגָן",hineni:"Aquí estoy, entre lo permitido y lo deseado. Enséñame a amar el límite como parte del amor.",lectura:"וּמֵעֵץ הַדַּעַת טוֹב וָרָע לֹא תֹאכַל מִמֶּנּוּ... (2:17) — Del árbol del conocimiento no comerás.",contexto:"Sexta aliyá: el primer límite. No es castigo, es definición. Sin el 'no', no hay elección. Hebcal nota que este es el origen de Orlá — dejar fruto sin tocar.",versiculoCentralHeb:"מִכֹּל עֵץ הַגָּן אָכֹל תֹּאכֵל",versiculoCentralEsp:"De todo árbol del jardín podrás comer.",versiculoRef:"Bereshit 2:16",fuente:"Kedushat Levi",ensenanzaTitulo:"El límite que te hace libre",ensenanza:"El Kedushat Levi dice: Dios le dice primero todo lo que SÍ puede comer, y solo después lo que no. El yetzer hará te hace escuchar al revés: solo oyes el no. Hoy vuelve a escuchar todos tus sí.",citaJasidica:"Kedushat Levi Bereshit — 'El tzadik escucha primero la abundancia, luego el límite'.",conexionAdam:{portal:"Adam Adamá",ficha:"Orla #14 - Límite sagrado",verso:"No tocar",desc:"Orla enseña que no comer de inmediato es dejar que algo madure para Dios."},examen:["¿Qué 'no' en mi vida escucho tan fuerte que olvido todos los 'sí'?","¿Qué estoy comiendo antes de tiempo por ansiedad?"],accion:{titulo:"Dejar un fruto",detalle:"Hoy deja algo sin comer/comprar/consumir aunque puedas. Un café, una compra impulsiva. Dile: 'te dejo madurar'.",tiempo:"1 no consciente"},tefila:"Que ame tanto la abundancia que pueda honrar el límite.",frase:"El límite no te quita, te define.",temasAdam:["Orla","Límite"]},{id:7,parasha:"Bereshit",parashaHeb:"בראשית",aliyah:7,aliyahRef:"Bereshit 3:22-5:24",hebrewDate:"30 de Tishrei 5787",gregDate:"23 oct 2026",title:"Fuera del Gan, Cerca de Casa",hineniHeb:"הִנְנִי בַּחוּץ",hineni:"Aquí estoy, fuera del jardín que idealicé. Pero Tú también estás fuera, cuidándome la salida.",lectura:"וַיְשַׁלְּחֵהוּ יְהוָה אֱלֹהִים מִגַּן־עֵדֶן... וַיְגָרֶשׁ אֶת־הָאָדָם (3:23-24) — Y lo envió fuera... y lo expulsó, pero le hizo vestimentas.",contexto:"Séptima aliyá: expulsión y a la vez vestimenta. Dios no abandona. Hace ketonot or — túnicas de piel/luz. Incluso fuera, hay cuidado.",versiculoCentralHeb:"וַיַּעַשׂ יְהוָה אֱלֹהִים לְאָדָם וּלְאִשְׁתּוֹ כָּתְנוֹת עוֹר וַיַּלְבִּשֵׁם",versiculoCentralEsp:"E hizo Dios para Adam y su mujer túnicas de piel y los vistió.",versiculoRef:"Bereshit 3:21",fuente:"Rebbe Najman",ensenanzaTitulo:"La caída es el camino",ensenanza:"Rebbe Najman de Breslov enseña (Likutei Moharan I:22) que el descenso es para el ascenso. Dios te viste justo después de caer, para que sepas que la vergüenza no es tu ropa final.",citaJasidica:"Likutei Moharan 22 — 'Yeridá letzorej aliyá — Todo descenso es en aras de un ascenso mayor'.",conexionAdam:{portal:"Escucha",ficha:"Teshuvá #3",verso:"Volver",desc:"Teshuvá no es volver al Gan, es traer el Gan afuera."},examen:["¿Me castigo después de equivocarme o me visto con compasión?","¿Qué túnica de luz puedo ponerme hoy en vez de vergüenza?"],accion:{titulo:"Vestir a alguien",detalle:"Hoy viste a alguien con una palabra: dile a alguien algo que lo abrigue. Un cumplido verdadero, sin pedir nada.",tiempo:"1 frase de abrigo"},tefila:"Aunque esté fuera, vísteme Tú. Que no camine desnuda de misericordia.",frase:"Incluso fuera del jardín, estás vestida.",temasAdam:["Teshuvá","Humildad"]},{id:8,parasha:"Noaj",parashaHeb:"נח",aliyah:1,aliyahRef:"Bereshit 6:9-22",hebrewDate:"1 de Jeshván 5787",gregDate:"24 oct 2026",title:"Tzadik en su Generación",hineniHeb:"הִנְנִי בְּדוֹרִי",hineni:"Aquí estoy, en mi generación imperfecta. No me pidas ser perfecta, solo justa donde estoy.",lectura:"נֹחַ אִישׁ צַדִּיק תָּמִים הָיָה בְּדֹרֹתָיו אֶת־הָאֱלֹהִים הִתְהַלֶּךְ־נֹחַ (6:9)",contexto:"Inicio de Noaj: mundo corrupto. Noaj no es héroe épico, es tzadik en su generación — con sus límites. Rashi debate si sería tzadik en otra generación. La Torá lo deja así, humano.",versiculoCentralHeb:"אִישׁ צַדִּיק תָּמִים הָיָה בְּדֹרֹתָיו",versiculoCentralEsp:"Noaj fue hombre justo, íntegro en sus generaciones.",versiculoRef:"Bereshit 6:9",fuente:"Noam Elimelej",ensenanzaTitulo:"Justa en tu medida",ensenanza:"El Noam Elimelej enseña que 'bedorotav' significa que cada generación tiene su forma de justicia. No te compares con la generación ideal. Ser tzadik hoy es no hundirte con el cinismo de hoy.",citaJasidica:"Noam Elimelej Noaj — 'Cada tzadik ilumina según la oscuridad de su generación'.",conexionAdam:{portal:"Adam Adamá",ficha:"Comunidad #21 - No pelear por tierra",verso:"Tzadik",desc:"Ser justo es no sumarse a la violencia del entorno."},examen:["¿Me descalifico por no ser como las tzadikot de otros tiempos?","¿Dónde hoy puedo ser un poco más íntegra que ayer en mi generación?"],accion:{titulo:"Un acto justo pequeño",detalle:"Hoy haz justicia en miniatura: devuelve algo, paga lo justo, no te cueles. Sin publicarlo.",tiempo:"1 acto · oculto"},tefila:"Hazme justa en mi generación, no en la que imagino.",frase:"No tienes que salvar al mundo. Solo no corromperte en él.",temasAdam:["Justicia","Comunidad"]},{id:9,parasha:"Noaj",parashaHeb:"נח",aliyah:2,aliyahRef:"Bereshit 6:22-7:16",hebrewDate:"2 de Jeshván 5787",gregDate:"25 oct 2026",title:"La Palabra como Arca",hineniHeb:"הִנְנִי בַּתֵּבָה",hineni:"Aquí estoy, entrando a la palabra. Que tu palabra sea mi arca cuando el agua sube.",lectura:"עֲשֵׂה לְךָ תֵּבַת עֲצֵי־גֹפֶר... וּבָאתָ אֶל־הַתֵּבָה (6:14, 7:7)",contexto:"Segunda aliyá: construcción del arca. Midrash dice que 'tevá' también significa 'palabra'. Cuando el mundo se inunda, entra en la palabra.",versiculoCentralHeb:"בֹּא אֶל־הַתֵּבָה",versiculoCentralEsp:"Entra al arca.",versiculoRef:"Bereshit 7:1",fuente:"Baal Shem Tov",ensenanzaTitulo:"Entra en la palabra",ensenanza:"El Baal Shem Tov (Tzavaat HaRivash) enseña: cuando te asaltan pensamientos que inundan, entra en la tevá — en las letras de la plegaria. Di una palabra sagrada y habítala hasta que pase el diluvio.",citaJasidica:"BaSheT al Noaj — 'Tevá es la palabra; cuando vienen aguas malas, entra en la palabra'.",conexionAdam:{portal:"Escucha/Radio",ficha:"Aire y Palabra #4",verso:"Tevá",desc:"La palabra que cuida es arca."},examen:["¿Cuando me inundo, a dónde corro? ¿A más ruido o a una palabra?","¿Qué palabra me podría salvar hoy?"],accion:{titulo:"Una palabra arca",detalle:"Elige una palabra hoy (shalom, hineni, dayenu) y cada vez que sientas inundación, repítela 7 veces en silencio.",tiempo:"cada inundación"},tefila:"Que tu Nombre sea mi madera, tu aliento mi calafateo.",frase:"No siempre puedes parar el diluvio. Pero puedes entrar al arca.",temasAdam:["Aire y Palabra","Escucha"]},{id:10,parasha:"Noaj",parashaHeb:"נח",aliyah:3,aliyahRef:"Bereshit 7:17-8:14",hebrewDate:"3 de Jeshván 5787",gregDate:"26 oct 2026",title:"Agua que Purifica",hineniHeb:"הִנְנִי בַּמַּיִם",hineni:"Aquí estoy, bajo el agua que no destruye, sino que limpia. Lávame sin ahogarme.",lectura:"וַיְהִי הַגֶּשֶׁם עַל־הָאָרֶץ אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה... וַיִּזְכֹּר אֱלֹהִים אֶת־נֹחַ (7:12, 8:1)",contexto:"Tercera aliyá: 40 días de lluvia, espejo de los 40 días de Moshe en Sinaí. El agua que destruye también purifica. 'Vayizkor Elokim' — y Dios recordó — es el corazón del diluvio.",versiculoCentralHeb:"וַיִּזְכֹּר אֱלֹהִים אֶת־נֹחַ",versiculoCentralEsp:"Y recordó Dios a Noaj.",versiculoRef:"Bereshit 8:1",fuente:"Sfat Emet",ensenanzaTitulo:"Ser recordada",ensenanza:"El Sfat Emet dice: el diluvio es mikve. Dios no olvidó a Noaj, lo recordó dentro del agua. Cuando sientes que te hundes, no estás olvidada, estás en mikve.",citaJasidica:"Sfat Emet Noaj 5632 — 'Todo descenso al agua es para recordar el pacto'.",conexionAdam:{portal:"Adam Adamá",ficha:"Agua #7 - Mikve",verso:"Mayim",desc:"El agua que purifica es la misma que da vida."},examen:["¿Qué en mí necesita ser lavado, no arreglado?","¿Puedo confiar que incluso bajo agua soy recordada?"],accion:{titulo:"Mikve de manos",detalle:"Hoy lávate las manos con atención 3 veces, como mikve pequeño. Sin apuro. Siente el agua recordar tu nombre.",tiempo:"1 min x3"},tefila:"Recuérdame en mis aguas, como recordaste a Noaj.",frase:"No estás olvidada. Estás en mikve.",temasAdam:["Agua","Purificación"]},{id:11,parasha:"Noaj",parashaHeb:"נח",aliyah:4,aliyahRef:"Bereshit 8:15-9:7",hebrewDate:"4 de Jeshván 5787",gregDate:"27 oct 2026",title:"El Arco en la Nube",hineniHeb:"הִנְנִי בַּקֶּשֶׁת",hineni:"Aquí estoy, mirando el cielo después de la tormenta. Pon Tu arco como promesa entre mis nubes y Tu misericordia.",lectura:"אֶת־קַשְׁתִּי נָתַתִּי בֶעָנָן וְהָיְתָה לְאוֹת בְּרִית... (9:13)",contexto:"Cuarta aliyá: salida del arca y primer pacto con toda la humanidad. El arco iris no es para Dios, es para nosotros. Señal de que la misericordia contiene al juicio.",versiculoCentralHeb:"אֶת־קַשְׁתִּי נָתַתִּי בֶעָנָן",versiculoCentralEsp:"Mi arco he puesto en la nube.",versiculoRef:"Bereshit 9:13",fuente:"Kedushat Levi",ensenanzaTitulo:"El arco que mira hacia ti",ensenanza:"El Kedushat Levi enseña que el arco iris tiene sus colores hacia la tierra, no hacia el cielo. Dios se muestra vulnerable primero. La misericordia es un arco que Él tensa hacia nosotros.",citaJasidica:"Kedushat Levi Noaj — 'El arco iris es Dios mostrando que aún en juicio, recuerda la misericordia'.",conexionAdam:{portal:"Adam Adamá",ficha:"Cielo #12 - Señales",verso:"Keshet",desc:"Mirar el cielo es parte de guardar la tierra."},examen:["¿Después de mi tormenta, busco señales de misericordia o solo reviso daños?","¿Puedo ser arco iris para alguien hoy?"],accion:{titulo:"Señal de pacto",detalle:"Hoy después de un momento difícil (aunque sea pequeño), busca una señal de belleza: una luz, un color, un olor. Nómbrala como tu keshet.",tiempo:"1 señal"},tefila:"Que vea Tu arco incluso cuando mi nube es gris.",frase:"Toda nube puede llevar un arco.",temasAdam:["Misericordia","Cielo"]},{id:12,parasha:"Noaj",parashaHeb:"נח",aliyah:5,aliyahRef:"Bereshit 9:8-10:32",hebrewDate:"5 de Jeshván 5787",gregDate:"28 oct 2026",title:"Torre y Lenguaje",hineniHeb:"הִנְנִי בַּמִּגְדָּל",hineni:"Aquí estoy, tentada de construir torres para ser vista. Bájame a la tierra, a la lengua pequeña que une.",lectura:"וַיֹּאמְרוּ הָבָה נִבְנֶה־לָּנוּ עִיר וּמִגְדָּל וְרֹאשׁוֹ בַשָּׁמַיִם וְנַעֲשֶׂה־לָּנוּ שֵׁם (11:4)",contexto:"Quinta aliyá: genealogías y Torre de Babel. Quieren hacer nombre (shem) para no dispersarse. Dios confunde lenguas no como castigo, sino para que no haya un solo relato que domine.",versiculoCentralHeb:"וְנַעֲשֶׂה־לָּנוּ שֵׁם",versiculoCentralEsp:"Y hagámonos un nombre.",versiculoRef:"Bereshit 11:4",fuente:"Rebbe Najman",ensenanzaTitulo:"El nombre que no necesitas hacer",ensenanza:"Rebbe Najman enseña que querer hacerte un nombre es olvidar que ya tienes Nombre porque eres llamada. Babel es cuando todos hablan igual. La redención es cuando cada uno habla su lengua y aun así se entiende.",citaJasidica:"Likutei Moharan I:19 — 'La soberbia es querer subir al cielo para no necesitar del otro'.",conexionAdam:{portal:"Escucha/Radio",ficha:"Aire y Palabra #6 - Lashón",verso:"Shem",desc:"No hacerte nombre es dejar que la tierra te nombre."},examen:["¿Dónde estoy construyendo torre para que me vean?","¿Qué lengua mía se ha vuelto soberbia?"],accion:{titulo:"Bajar de la torre",detalle:"Hoy haz una tarea sin firmarla, sin contarla, sin foto. Que nadie sepa que fuiste tú. Destruye un ladrillo de tu torre.",tiempo:"1 acción oculta"},tefila:"No quiero hacerme un nombre. Quiero oír cómo Tú me llamas.",frase:"No necesitas hacerte un nombre. Ya tienes uno.",temasAdam:["Aire y Palabra","Humildad"]},{id:13,parasha:"Noaj",parashaHeb:"נח",aliyah:6,aliyahRef:"Bereshit 11:1-32",hebrewDate:"6 de Jeshván 5787",gregDate:"29 oct 2026",title:"Lashón - Lenguas",hineniHeb:"הִנְנִי בִּשְׂפָתַי",hineni:"Aquí estoy, con mi lengua confundida y sagrada. Purifica mis labios para que no construya más torres con palabras.",lectura:"וַיָּפֶץ יְהוָה אֹתָם מִשָּׁם עַל־פְּנֵי כָל־הָאָרֶץ (11:8)",contexto:"Sexta aliyá: dispersión. La Torá valora la dispersión como biodiversidad cultural. No todos deben hablar igual. Cada lengua es una forma distinta de cuidar la tierra.",versiculoCentralHeb:"וַיָּפֶץ יְהוָה",versiculoCentralEsp:"Y los dispersó Dios.",versiculoRef:"Bereshit 11:8",fuente:"Or HaChaim",ensenanzaTitulo:"La dispersión como bendición",ensenanza:"Or HaChaim dice que 'vayafetz' es como esparcir semillas, no como castigo. Dios esparce lenguas como quien siembra diversidad, para que ninguna cultura aplaste a otra.",citaJasidica:"Or HaChaim 11:8 — 'La dispersión es siembra'.",conexionAdam:{portal:"Adam Adamá",ficha:"Biodiversidad #18",verso:"Safá",desc:"Cada lengua guarda una forma de nombrar la tierra."},examen:["¿Honro la forma distinta en que otros hablan del mundo?","¿Mi lengua hoy siembra o aplasta?"],accion:{titulo:"Aprender una palabra",detalle:"Aprende hoy una palabra en otra lengua para nombrar algo de la tierra (agua, árbol, tierra) y úsala una vez con kavana.",tiempo:"2 min"},tefila:"Que mi lengua no sea torre, sino puente.",frase:"Hablar distinto no es estar confundido. Es estar sembrado.",temasAdam:["Lenguaje","Biodiversidad"]},{id:14,parasha:"Noaj",parashaHeb:"נח",aliyah:7,aliyahRef:"Bereshit 10:1-11:32 cierre",hebrewDate:"7 de Jeshván 5787",gregDate:"30 oct 2026",title:"Generaciones",hineniHeb:"הִנְנִי בְּתוֹלְדוֹת",hineni:"Aquí estoy, entre generaciones. No soy el inicio ni el final, soy eslabón.",lectura:"אֵלֶּה תּוֹלְדֹת... (10:1) — Estas son las generaciones.",contexto:"Séptima aliyá: listas de nombres que parecen aburridas, pero son mapa. De Noaj a Avram. Cada nombre es un puente. Sin esta lista no hay Lej Lejá.",versiculoCentralHeb:"אֵלֶּה תּוֹלְדֹת שֵׁם",versiculoCentralEsp:"Estas son las generaciones de Shem.",versiculoRef:"Bereshit 11:10",fuente:"Sfat Emet",ensenanzaTitulo:"Tiempo y Dinero, generaciones",ensenanza:"El Sfat Emet enseña que 'toldot' es tiempo acumulado. No hay atajo generacional. Avram no aparece de la nada; viene de Noaj, que viene de Adam. Tu camino también necesita antepasados.",citaJasidica:"Sfat Emet Noaj 5634 — 'Cada generación guarda la luz para la siguiente'.",conexionAdam:{portal:"Adam Adamá",ficha:"Tiempo y Dinero #22",verso:"Toldot",desc:"El tiempo es herencia, no propiedad."},examen:["¿Honro de dónde vengo o quiero inventarme sola?","¿Qué estoy guardando para la generación que viene?"],accion:{titulo:"Nombrar antepasados",detalle:"Hoy nombra en voz alta 3 personas que te trajeron hasta aquí (familia, maestra, tierra). Di: 'Gracias por ser mi toldot'.",tiempo:"3 nombres"},tefila:"Que no olvide que soy continuación, no origen.",frase:"Eres eslabón, no isla.",temasAdam:["Tiempo","Generaciones"]},{id:15,parasha:"Lej Lejá",parashaHeb:"לך לך",aliyah:1,aliyahRef:"Bereshit 12:1-13",hebrewDate:"8 de Jeshván 5787",gregDate:"31 oct 2026",title:"Lej Lejá - Sal",hineniHeb:"הִנְנִי הוֹלֶכֶת",hineni:"Aquí estoy, con miedo y con llamado. No me pidas que sepa a dónde voy, solo que me atreva a salir.",lectura:"לֶךְ־לְךָ מֵאַרְצְךָ וּמִמּוֹלַדְתְּךָ וּמִבֵּית אָבִיךָ אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ (12:1)",contexto:"Inicio de Lej Lejá: primer llamado a Avram. Hebcal nota que 'lej lejá' es pleonasmo: ve hacia ti. No es solo geografía, es interioridad. Deja tierra, lugar de nacimiento, casa paterna — tres desprendimientos.",versiculoCentralHeb:"לֶךְ־לְךָ",versiculoCentralEsp:"Vete hacia ti.",versiculoRef:"Bereshit 12:1",fuente:"Baal Shem Tov",ensenanzaTitulo:"Viaje hacia ti",ensenanza:"El Baal Shem Tov dice: 'Lej lejá' — ve a ti misma. Todo viaje exterior es para encontrarte dentro. Dios no le muestra la tierra a Avram antes de salir; se la muestra mientras camina. Camina y verás.",citaJasidica:"Degel Majané Efraim Lej Lejá — 'El principal viaje es desde el exterior hacia el interior'.",conexionAdam:{portal:"Mi Camino",ficha:"Viaje interior",verso:"Lej Lejá",desc:"Salir de tu tierra es salir de tus certezas para cuidar mejor."},examen:["¿De qué tierra cómoda me está pidiendo la vida salir?","¿Puedo salir sin tener el mapa completo?"],accion:{titulo:"Un pequeño Lej Lejá",detalle:"Hoy cambia una ruta: vuelve por otro camino, siéntate en otro lugar, come algo distinto. Un micro éxodo.",tiempo:"1 cambio de ruta"},tefila:"Dame valor para salir, aunque no vea la tierra prometida.",frase:"No necesitas ver la tierra para empezar a caminar.",temasAdam:["Viaje","Valentía"]},{id:16,parasha:"Lej Lejá",parashaHeb:"לך לך",aliyah:2,aliyahRef:"Bereshit 12:14-13:18",hebrewDate:"9 de Jeshván 5787",gregDate:"1 nov 2026",title:"Avram y Lot - No Pelear por Tierra",hineniHeb:"הִנְנִי אַחִים",hineni:"Aquí estoy, aprendiendo que la tierra es demasiado grande para pelear por ella.",lectura:"וַיֹּאמֶר אַבְרָם אֶל־לוֹט אַל־נָא תְהִי מְרִיבָה בֵּינִי וּבֵינֶךָ... הֲלֹא כָל־הָאָרֶץ לְפָנֶיךָ (13:8-9)",contexto:"Segunda aliyá: conflicto de pastores entre Avram y Lot. Avram renuncia a pelear: toda la tierra está delante de ti, elige. Es el primer modelo de ecología no posesiva.",versiculoCentralHeb:"אַל־נָא תְהִי מְרִיבָה בֵּינִי וּבֵינֶךָ",versiculoCentralEsp:"Que no haya pleito entre tú y yo.",versiculoRef:"Bereshit 13:8",fuente:"Noam Elimelej",ensenanzaTitulo:"La tierra no se pelea",ensenanza:"El Noam Elimelej enseña que Avram entendió que la tierra que se pelea se vuelve estéril. La que se suelta, da fruto. No pelear no es debilidad, es fe en que hay suficiente para todos.",citaJasidica:"Noam Elimelej Lej Lejá — 'El que deja la tierra por Shalom, la tierra lo bendice'.",conexionAdam:{portal:"Adam Adamá",ficha:"Tierra Compartida #19",verso:"Al na tehi meriva",desc:"Cuidar la tierra empieza por no pelear por ella."},examen:["¿Dónde estoy peleando por tierra — atención, razón, territorio — que podría soltar?","¿Puedo confiar que hay suficiente?"],accion:{titulo:"No pelear hoy",detalle:"Hoy en un conflicto pequeño, cede. No para perder, sino para decir 'toda la tierra está delante de ti'. Elige shalom.",tiempo:"1 cesión consciente"},tefila:"Hazme grande como Avram, que pudo decir: elige tú primero.",frase:"Hay suficiente tierra para no pelear.",temasAdam:["Tierra","Shalom"]},{id:17,parasha:"Lej Lejá",parashaHeb:"לך לך",aliyah:3,aliyahRef:"Bereshit 14:1-20",hebrewDate:"10 de Jeshván 5787",gregDate:"2 nov 2026",title:"Brit ben Habetarim - Pacto entre Partes",hineniHeb:"הִנְנִי בַּבְּרִית",hineni:"Aquí estoy, partida y pactada. Pasa entre mis mitades como fuego.",lectura:"וַיְבַתֵּר אֹתָם בַּתָּוֶךְ... וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ (15:10,17)",contexto:"Tercera aliyá: pacto de los pedazos. Avram corta animales por la mitad y una antorcha pasa entre ellos. Es pacto antiguo: caminar entre partes significa 'que me pase lo mismo si no cumplo'. Dios es el que pasa.",versiculoCentralHeb:"וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ",versiculoCentralEsp:"Y he aquí un horno humeante y una antorcha de fuego.",versiculoRef:"Bereshit 15:17",fuente:"Sfat Emet",ensenanzaTitulo:"Dios pasa entre tus pedazos",ensenanza:"El Sfat Emet dice: todos estamos partidos. El pacto no es que tú te arregles para pactar; es que Dios pasa entre tus pedazos rotos y dice: Yo estoy aquí incluso así.",citaJasidica:"Sfat Emet Lej Lejá 5635 — 'El pacto se hace entre lo roto, no entre lo perfecto'.",conexionAdam:{portal:"Escucha",ficha:"Brit #5",verso:"Batar",desc:"Partir es también pactar."},examen:["¿Qué parte rota mía escondo por miedo a no ser digna de pacto?","¿Dejo que Dios pase por mi mitad oscura?"],accion:{titulo:"Nombrar tu mitad",detalle:"Hoy escribe en un papel una parte tuya partida (miedo, cansancio) y enciende una vela encima. Di: que el fuego pase.",tiempo:"5 min"},tefila:"Pasa entre mis pedazos, no me pidas estar entera para pactar.",frase:"Dios pacta con lo roto, no con lo perfecto.",temasAdam:["Pacto","Vulnerabilidad"]},{id:18,parasha:"Lej Lejá",parashaHeb:"לך לך",aliyah:4,aliyahRef:"Bereshit 14:21-15:6 / 16:1-6",hebrewDate:"11 de Jeshván 5787",gregDate:"3 nov 2026",title:"Hagar - Ver al Otro",hineniHeb:"הִנְנִי רֹאָה",hineni:"Aquí estoy, aprendiendo a ver como Tú ves a Hagar en el desierto.",lectura:"וַתִּקְרָא שֵׁם־יְהוָה הַדֹּבֵר אֵלֶיהָ אַתָּה אֵל רֳאִי... (16:13) — Tú eres Dios que me ve.",contexto:"Cuarta aliyá: Hagar huye, es vista por un ángel junto a un pozo. Es la primera persona en nombrar a Dios. No Avram, sino una esclava egipcia en el desierto. La Torá pone el ver en el margen.",versiculoCentralHeb:"אַתָּה אֵל רֳאִי",versiculoCentralEsp:"Tú eres Dios que me ve.",versiculoRef:"Bereshit 16:13",fuente:"Kedushat Levi",ensenanzaTitulo:"El Dios que ve a la invisible",ensenanza:"El Kedushat Levi enseña que Hagar nos enseña el nombre más importante de Dios: El que ve. No el poderoso, sino el que ve a quien nadie ve. Cuando ves al otro, te vuelves como Dios.",citaJasidica:"Kedushat Levi Lej Lejá — 'Quien ve al invisible, ve a Dios'.",conexionAdam:{portal:"Adam Adamá",ficha:"Ver al Otro #23",verso:"El Roi",desc:"Cuidar la tierra es ver a quien la trabaja y nadie ve."},examen:["¿A quién hoy no estoy viendo?","¿Quién es mi Hagar en el desierto cotidiano?"],accion:{titulo:"Ver a una invisible",detalle:"Hoy mira a los ojos a alguien que suele ser invisible (quien limpia, quien sirve, quien está al margen) y nómbralo con respeto.",tiempo:"1 mirada verdadera"},tefila:"Abre mis ojos para ver como Tú ves a Hagar.",frase:"Ver es un acto sagrado.",temasAdam:["Ver al Otro","Justicia"]},{id:19,parasha:"Lej Lejá",parashaHeb:"לך לך",aliyah:5,aliyahRef:"Bereshit 16:7-17:6",hebrewDate:"12 de Jeshván 5787",gregDate:"4 nov 2026",title:"Brit Milá - Cuerpo como Pacto",hineniHeb:"הִנְנִי בְּגוּפִי",hineni:"Aquí estoy, con mi cuerpo como pergamino de pacto. No contra mi cuerpo, sino con él.",lectura:"וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם לִבְרִית עוֹלָם (17:13)",contexto:"Quinta aliyá: pacto de la circuncisión. El pacto entra en la carne. No es idea, es cuerpo. A los 99 años Avram marca su cuerpo.",versiculoCentralHeb:"וְהָיְתָה בְרִיתִי בִּבְשַׂרְכֶם",versiculoCentralEsp:"Y estará Mi pacto en vuestra carne.",versiculoRef:"Bereshit 17:13",fuente:"Or HaChaim",ensenanzaTitulo:"El cuerpo recuerda",ensenanza:"Or HaChaim enseña que 'bivsarjem' — en vuestra carne — significa que el cuerpo tiene memoria espiritual. No necesitas entender todo con la mente; tu carne puede guardar pacto.",citaJasidica:"Or HaChaim 17:13 — 'El cuerpo del tzadik es Torá'.",conexionAdam:{portal:"Adam Adamá",ficha:"Cuerpo #11 - Adam Adamá",verso:"Basar",desc:"El cuerpo es tierra. Pactar con él es pactar con la tierra."},examen:["¿Trato mi cuerpo como enemigo o como pacto?","¿Qué marca amorosa puedo hacer hoy en mi cuerpo (descanso, alimento, caricia)?"],accion:{titulo:"Pacto corporal",detalle:"Hoy haz una acción de cuidado corporal consciente: masajea tus pies con aceite, come lento, duerme 20 min. Di: esto es brit.",tiempo:"10 min"},tefila:"Que mi cuerpo sea lugar de Tu pacto, no campo de batalla.",frase:"Tu cuerpo también es Torá.",temasAdam:["Cuerpo","Pacto"]},{id:20,parasha:"Lej Lejá",parashaHeb:"לך לך",aliyah:6,aliyahRef:"Bereshit 17:7-27",hebrewDate:"13 de Jeshván 5787",gregDate:"5 nov 2026",title:"Avraham Hospitalario - Abrir Puerta",hineniHeb:"הִנְנִי פּוֹתֵחַ",hineni:"Aquí estoy, con la puerta entreabierta. Enséñame a abrir como Avraham, sin saber quién viene.",lectura:"וַיֵּשֶׁב בְּפֶתַח הָאֹהֶל כְּחֹם הַיּוֹם (18:1) — Sentado a la entrada de la tienda al calor del día. (Anticipa Vayerá pero nace aquí)",contexto:"Sexta aliyá: Avraham a los 99 años, dolorido por brit milá, se sienta a esperar huéspedes. Midrash dice que tenía la tienda abierta a los cuatro vientos. Hospitalidad como sanación.",versiculoCentralHeb:"וַיָּרָץ לִקְרָאתָם",versiculoCentralEsp:"Y corrió hacia ellos.",versiculoRef:"Bereshit 18:2",fuente:"Baal Shem Tov",ensenanzaTitulo:"Maaké - abrir puerta",ensenanza:"El Besht conecta 'petaj haohel' con 'maaké' — hacer baranda en techo (Devarim 22:8) pero también abrir. La casa que no abre puerta se cae. Avraham corre a los 99 porque abrir cura.",citaJasidica:"Baal Shem Tov Lej Lejá — 'Más que el huésped necesita pan, el anfitrión necesita abrir'.",conexionAdam:{portal:"Shabat",ficha:"Hachnasat Orjim #4",verso:"Petaj",desc:"Abrir la casa es abrir el corazón a la tierra."},examen:["¿Mi casa/corazón está abierta a los cuatro vientos o solo a los conocidos?","¿Corro hacia el otro o espero que venga?"],accion:{titulo:"Abrir puerta",detalle:"Hoy abre literalmente tu puerta 5 minutos más de lo usual, o invita a alguien a tu mesa sin planear. Café sin agenda.",tiempo:"5 min puerta abierta"},tefila:"Haz de mi tienda un lugar con cuatro puertas.",frase:"Abrir la puerta también te cura a ti.",temasAdam:["Hospitalidad","Casa"]},{id:21,parasha:"Lej Lejá",parashaHeb:"לך לך",aliyah:7,aliyahRef:"Bereshit 17:24-27 cierre",hebrewDate:"14 de Jeshván 5787",gregDate:"6 nov 2026",title:"Nuevo Nombre - Avraham",hineniHeb:"הִנְנִי בְּשֵׁם חָדָשׁ",hineni:"Aquí estoy, dejando que me renombres. No soy quien era ayer.",lectura:"וְלֹא־יִקָּרֵא עוֹד אֶת־שִׁמְךָ אַבְרָם וְהָיָה שִׁמְךָ אַבְרָהָם (17:5)",contexto:"Séptima aliyá: cambio de nombre. Avram (padre exaltado) a Avraham (padre de multitudes). Añadir una letra — Hei — que es aliento de Dios. El nombre cambia destino.",versiculoCentralHeb:"וְהָיָה שִׁמְךָ אַבְרָהָם",versiculoCentralEsp:"Y será tu nombre Avraham.",versiculoRef:"Bereshit 17:5",fuente:"Rebbe Najman",ensenanzaTitulo:"Ser renombrada",ensenanza:"Rebbe Najman (Likutei Moharan II:12) enseña que cada teshuvá es cambio de nombre. Cuando cambias un acto, Dios te añade una letra. No necesitas cambiar todo, solo dejar que te añada aliento.",citaJasidica:"Rebbe Najman II:12 — 'Con cada buen cambio, te dan nuevo nombre arriba'.",conexionAdam:{portal:"Mi Camino",ficha:"Nombre #2",verso:"Shem Jadash",desc:"Cambiar nombre es cambiar relación con la tierra."},examen:["¿Qué nombre viejo me queda chico?","¿Qué letra nueva me está añadiendo Dios hoy?"],accion:{titulo:"Escribir tu nombre nuevo",detalle:"Escribe hoy cómo te llamarías si tu nombre reflejara tu anhelo actual (ej: Menucha, Orah). Guarda ese papel.",tiempo:"3 min"},tefila:"Llámame de nuevo, con la letra que me falta.",frase:"Tu nuevo nombre ya está siendo susurrado.",temasAdam:["Nombre","Teshuvá"]},{id:22,parasha:"Vayerá",parashaHeb:"וירא",aliyah:1,aliyahRef:"Bereshit 18:1-14",hebrewDate:"15 de Jeshván 5787",gregDate:"7 nov 2026",title:"Vayerá y la Risa",hineniHeb:"הִנְנִי צוֹחֶקֶת",hineni:"Aquí estoy, riéndome como Sará detrás de la puerta. Mi risa también es plegaria.",lectura:"וַתִּצְחַק שָׂרָה בְּקִרְבָּהּ... הֲיִפָּלֵא מֵיְהוָה דָּבָר (18:12,14)",contexto:"Inicio de Vayerá: visita de ángeles y anuncio de nacimiento imposible. Sará se ríe. Dios no la reta por reír, sino que le pregunta sobre la risa. La risa es el inicio de Yitzjak.",versiculoCentralHeb:"הֲיִפָּלֵא מֵיְהוָה דָּבָר",versiculoCentralEsp:"¿Hay algo imposible para Dios?",versiculoRef:"Bereshit 18:14",fuente:"Baal Shem Tov",ensenanzaTitulo:"Trabajo y acogida",ensenanza:"El Besht dice que Sará ríe porque el milagro le parece trabajo demasiado grande. Dios le enseña que acoger vida es trabajo sagrado — avodá. Reír es reconocer que no controlas.",citaJasidica:"Baal Shem Tov Vayerá — 'La risa de Sará es la alegría del que deja de controlar'.",conexionAdam:{portal:"Adam Adamá",ficha:"Trabajo #9 - Avodá",verso:"Tzijak",desc:"Reír es parte del trabajo de cuidar."},examen:["¿Me permito reír de lo imposible o me avergüenzo?","¿Dónde necesito acoger lo que parece imposible?"],accion:{titulo:"Reír 1 minuto",detalle:"Hoy ríe a propósito 1 minuto sola, aunque no haya chiste. Deja que la risa abra tu tienda como Sará.",tiempo:"1 min risa"},tefila:"Haz que mi risa sea anuncio, no burla.",frase:"Tu risa también puede ser profecía.",temasAdam:["Trabajo","Risa"]},{id:23,parasha:"Vayerá",parashaHeb:"וירא",aliyah:2,aliyahRef:"Bereshit 18:15-33",hebrewDate:"16 de Jeshván 5787",gregDate:"8 nov 2026",title:"Sdom - Justicia y Misericordia",hineniHeb:"הִנְנִי בְּצֶדֶק",hineni:"Aquí estoy, entre Sdom y misericordia. Enséñame a pedir justicia sin perder ternura.",lectura:"הֲשֹׁפֵט כָּל־הָאָרֶץ לֹא יַעֲשֶׂה מִשְׁפָּט... אוּלַי יֵשׁ חֲמִשִּׁים צַדִּיקִם (18:25,24)",contexto:"Segunda aliyá: Avraham discute con Dios por Sdom. Primera vez que un humano defiende a una ciudad malvada. Midrash: Avraham aprende que justicia sin misericordia es Sdom al revés.",versiculoCentralHeb:"הֲשֹׁפֵט כָּל־הָאָרֶץ לֹא יַעֲשֶׂה מִשְׁפָּט",versiculoCentralEsp:"¿El Juez de toda la tierra no hará justicia?",versiculoRef:"Bereshit 18:25",fuente:"Noam Elimelej",ensenanzaTitulo:"Ciudad refugio",ensenanza:"El Noam Elimelej enseña que Avraham pide por 50, 45, 30, 10 tzadikim — no para salvar culpables, sino para enseñar que siempre hay chispa. Ir Miklat — ciudad refugio — es ver chispa en ciudad condenada.",citaJasidica:"Noam Elimelej Vayerá — 'El tzadik ve justo incluso en Sdom'.",conexionAdam:{portal:"Adam Adamá",ficha:"Ir Miklat #20 - Ciudad Refugio",verso:"Mishpat",desc:"Justicia que no deja espacio para volver es venganza."},examen:["¿Cuándo mi justicia se vuelve Sdom — dura, sin refugio?","¿Puedo ver 10 chispas buenas en quien juzgo?"],accion:{titulo:"Defender a Sdom hoy",detalle:"Hoy defiende en tu corazón o en voz baja a alguien que todos juzgan. Busca sus 10 tzadikim internos.",tiempo:"1 defensa interior"},tefila:"Hazme jueza que busca tzadikim, no culpables.",frase:"Justicia sin refugio no es justicia.",temasAdam:["Justicia","Ir Miklat"]},{id:24,parasha:"Vayerá",parashaHeb:"וירא",aliyah:3,aliyahRef:"Bereshit 19:1-20",hebrewDate:"17 de Jeshván 5787",gregDate:"9 nov 2026",title:"Lot y los Ángeles - Puertas de Noche",hineniHeb:"הִנְנִי בַּלַּיְלָה",hineni:"Aquí estoy, de noche, abriendo puerta cuando todos la cierran.",lectura:"וַיָּבֹאוּ שְׁנֵי הַמַּלְאָכִים סְדֹמָה בָּעֶרֶב וְלוֹט יֹשֵׁב בְּשַׁעַר־סְדֹם (19:1)",contexto:"Tercera aliyá: Lot sentado a la puerta de Sdom al anochecer, como Avraham al mediodía, pero en ciudad hostil. Hospitalidad en contexto peligroso. Ángels necesitan baranda.",versiculoCentralHeb:"וְלוֹט יֹשֵׁב בְּשַׁעַר־סְדֹם",versiculoCentralEsp:"Y Lot estaba sentado a la puerta de Sdom.",versiculoRef:"Bereshit 19:1",fuente:"Sfat Emet",ensenanzaTitulo:"Sentarse a la puerta de noche",ensenanza:"El Sfat Emet dice: Avraham se sienta al mediodía, Lot al anochecer. Hay tzadikim de día y tzadikim de noche. Lot es tzadik de noche: hace lo correcto cuando da miedo hacerlo.",citaJasidica:"Sfat Emet Vayerá 5632 — 'Hay quien sirve a Dios de día y quien de noche; ambos son amados'.",conexionAdam:{portal:"Shabat",ficha:"Luz de Noche #5",verso:"Shaar",desc:"Abrir puerta de noche es acto de valentía."},examen:["¿Me atrevo a ser hospitalaria incluso cuando el entorno es hostil?","¿Dónde soy tzadik de noche?"],accion:{titulo:"Hospitalidad nocturna",detalle:"Hoy ofrece algo de noche: mensaje de buenas noches consciente, luz encendida para alguien que vuelve tarde.",tiempo:"noche"},tefila:"Hazme puerta incluso en Sdom.",frase:"Hay santidad que solo se ve de noche.",temasAdam:["Hospitalidad","Noche"]},{id:25,parasha:"Vayerá",parashaHeb:"וירא",aliyah:4,aliyahRef:"Bereshit 19:21-21:4",hebrewDate:"18 de Jeshván 5787",gregDate:"10 nov 2026",title:"Akedá - Principio de la Entrega",hineniHeb:"הִנְנִי נוֹתֶנֶת",hineni:"Aquí estoy, aprendiendo que entregar no es perder, sino devolver.",lectura:"קַח־נָא אֶת־בִּנְךָ אֶת־יְחִידְךָ אֲשֶׁר־אָהַבְתָּ אֶת־יִצְחָק... (22:2) — Toma a tu hijo, tu único, al que amas...",contexto:"Cuarta aliyá: inicio de la Akedá. Dios pide lo más amado. No para quitar, sino para enseñar que el amor no es posesión. Hebcal: este es el clímax de Vayerá.",versiculoCentralHeb:"אֶת־יְחִידְךָ אֲשֶׁר־אָהַבְתָּ",versiculoCentralEsp:"A tu único, al que amas.",versiculoRef:"Bereshit 22:2",fuente:"Kedushat Levi",ensenanzaTitulo:"Entrega",ensenanza:"El Kedushat Levi llora al leer Akedá: Avraham no entrega a Yitzjak a Dios; se entrega a sí mismo. La verdadera akedá es atar tu propio 'yo quiero poseer' al altar.",citaJasidica:"Kedushat Levi Vayerá — 'Akedá es atar el amor posesivo'.",conexionAdam:{portal:"Adam Adamá",ficha:"Entrega #24 - Akedá",verso:"Yajid",desc:"Entregar lo amado es reconocer que nunca fue tuyo, sino confiado."},examen:["¿Qué estoy sosteniendo tan fuerte que se me hace posesión?","¿Puedo amar sin poseer hoy?"],accion:{titulo:"Soltar lo amado 10 min",detalle:"Hoy suelta por 10 minutos el control sobre algo amado (hijo, proyecto, imagen). No revises, no controles. Confía.",tiempo:"10 min soltar"},tefila:"Enséñame a amar sin atar.",frase:"Amar es confiar, no poseer.",temasAdam:["Entrega","Amor"]},{id:26,parasha:"Vayerá",parashaHeb:"וירא",aliyah:5,aliyahRef:"Bereshit 21:5-21:34 / 22:1-19",hebrewDate:"19 de Jeshván 5787",gregDate:"11 nov 2026",title:"Akedá - Bikurim",hineniHeb:"הִנְנִי מַעֲלָה",hineni:"Aquí estoy, subiendo con lo que más amo. No para perderlo, sino para elevarlo.",lectura:"וַיֵּלֶךְ... אֶל־הַמָּקוֹם אֲשֶׁר־אָמַר־לוֹ הָאֱלֹהִים... וַיַּעֲקֹד אֶת־יִצְחָק (22:3,9)",contexto:"Quinta aliyá: caminata de 3 días y atado. Midrash dice que Satan y Yitzjak mismo intentan detenerlo. Avraham ve el lugar desde lejos — 'vayar et hamakom merajok'. Ver de lejos es fe.",versiculoCentralHeb:"וַיַּרְא אֶת־הַמָּקוֹם מֵרָחֹק",versiculoCentralEsp:"Y vio el lugar de lejos.",versiculoRef:"Bereshit 22:4",fuente:"Or HaChaim",ensenanzaTitulo:"Bikurim - entregar lo primero",ensenanza:"Or HaChaim conecta Akedá con Bikurim: llevar lo primero al Templo. Avraham lleva lo primero de su corazón — su hijo — y Dios le enseña que bikurim no se pierde, se eleva y vuelve multiplicado.",citaJasidica:"Or HaChaim 22:4 — 'Ver de lejos es ver con fe lo que aún no tocas'.",conexionAdam:{portal:"Adam Adamá",ficha:"Bikurim #15 - Primicias",verso:"Reishit",desc:"Entregar primicia es decir: todo viene de la tierra, no de mi control."},examen:["¿Qué primicia — primer fruto de mi trabajo — puedo entregar hoy en vez de guardarla?","¿Veo el lugar de mi entrega de lejos con miedo o con fe?"],accion:{titulo:"Entregar bikurim",detalle:"Hoy entrega lo primero: primer pan, primera hora, primer agradecimiento, no lo último que sobra.",tiempo:"1 primicia"},tefila:"Que lo que entrego vuelva como bendición, no como pérdida.",frase:"Lo primero que entregas, te entrega a ti.",temasAdam:["Bikurim","Entrega"]},{id:27,parasha:"Vayerá",parashaHeb:"וירא",aliyah:6,aliyahRef:"Bereshit 22:20-23:20 / 24:1-",hebrewDate:"20 de Jeshván 5787",gregDate:"12 nov 2026",title:"Sara y Rivká - Agua Viva",hineniHeb:"הִנְנִי מַיִם חַיִּים",hineni:"Aquí estoy, como Rivká junto al pozo, ofreciendo agua sin que me la pidan.",lectura:"וְה
