 Tashjit es el límite ético a tu poder.",practica:"Hoy detecta un desperdicio automático: luz prendida, comida que tiras, ropa que usas una vez. Interrumpe un ciclo de destrucción."},profunda:{hebrew:"כִּי מִמֶּנּוּ תֹאכֵל וְאֹתוֹ לֹא תִכְרֹת",comment:"Rambam lo lleva de árboles a todo: quien rompe objetos, desperdicia comida, rasga ropa por ira — transgrede Bal Tashjit. El mundo no es descartable.",root:"ש-ח-ת: corromper, descomponer. Destruir es corromper tu propia humanidad."},practica7:["Día 1: No tires comida","Día 2: Reutiliza un envase","Día 3: Apaga lo que no usas","Día 4: No compres por impulso","Día 5: Repara","Día 6: Dona lo útil","Día 7: Agradece lo que no destruiste"]},{id:"1.3",blockId:1,heLetter:"ה",titleHe:"Hashavá (הֲשָׁבָה)",titleEs:"Devolver / Reutilizar",verse:"Shemot 23:4",subtitle:"Devolver es completar el ciclo.",category:"Fundamentos",abierta:{intro:"Devolver lo perdido no es solo de objetos, es de energía. Todo lo que tomas debe poder volver a su lugar de alguna forma. Economía circular antes de que existiera el término.",practica:"Devuelve hoy algo: un libro, un favor, una atención. Cierra un ciclo abierto."},profunda:{hebrew:"הָשֵׁב תְּשִׁיבֵם",comment:"Rashi: aunque tu enemigo te deba, devuélvele. Seforno: hashavá educa contra la apropiación. Devolver te devuelve a ti.",root:"ש-ו-ב: volver, retornar, hacer teshuvá. Reutilizar es teshuvá del objeto."},practica7:["Día 1: Devuelve un objeto","Día 2: Reutiliza","Día 3: Compensa una deuda","Día 4: Agradece devolviendo","Día 5: Repara para otro","Día 6: No acumules","Día 7: Suelta"]},{id:"1.4",blockId:1,heLetter:"ת",titleHe:"Tikkun (תִּקּוּן)",titleEs:"Transformar",verse:"Tehilim 104:30",subtitle:"Renuevas la faz de la tierra.",category:"Fundamentos",abierta:{intro:"No solo conservar, también mejorar. Tikkun es tomar lo roto y hacerlo más bello que antes. Es la ecología activa: no dejas como estaba, dejas mejor.",practica:"Toma algo gastado y mejóralo. Un mueble, una relación, una esquina de tu casa. Tikkun hoy."},profunda:{hebrew:"תְּשַׁלַּח רוּחֲךָ יִבָּרֵאוּן וּתְחַדֵּשׁ פְּנֵי אֲדָמָה",comment:"Arizal: las chispas rotas esperan tu mano. Ramban: tikkun olam es tarea humana, no milagro.",root:"ת-ק-ן: fijar, preparar, hacer apto. De ahí takaná — norma que repara la sociedad."},practica7:["Día 1: Repara visible","Día 2: Mejora un proceso","Día 3: Pide perdón y repara","Día 4: Transforma residuo en recurso","Día 5: Enseña un tikkun","Día 6: Crea algo útil de lo roto","Día 7: Contempla lo transformado"]}]},{id:2,title:"AGUA Y ÁRBOL",subtitle:"La paciencia de lo vivo",heLetter:"מ",category:"Naturaleza",desc:"El agua enseña a bajar. El árbol, a esperar.",fichas:[{id:"2.1",blockId:2,heLetter:"מ",titleHe:"Mayim Chayim (מַיִם חַיִּים)",titleEs:"Agua viva",verse:"Vayikra 14:5",subtitle:"Agua que corre, que da vida.",category:"Naturaleza",abierta:{intro:"No toda agua purifica. Solo mayim chayim, agua viva, que corre, que se mueve, que viene de fuente. La Torá intuye: agua estancada enferma, agua viva cura.",practica:"Hoy bebe con intención. No de botella plástica si puedes. Agradece el agua antes de abrir la canilla. No la dejes correr sin sentido."},profunda:{hebrew:"מַיִם חַיִּים אֶל־כֶּלִי",comment:"Rashi: agua de manantial, no de pozo. Seforno: chayim porque contiene movimiento, como la vida misma.",root:"מ-י-ם: plural, siempre en movimiento. Chayim: vidas, también plural."},practica7:["Día 1: No desperdicies agua","Día 2: Limpia una fuente/canilla","Día 3: Riega con medida","Día 4: Agradece 3 veces el agua","Día 5: No contamines desagüe","Día 6: Comparte agua","Día 7: Mikve simbólico — lávate con kavaná"]},{id:"2.2",blockId:2,heLetter:"ע",titleHe:"Orla (עָרְלָה)",titleEs:"El árbol joven espera",verse:"Vayikra 19:23",subtitle:"Tres años no comerás su fruto.",category:"Naturaleza",abierta:{intro:"Un árbol recién plantado no se explota. Tres años su fruto es orlá, incircunciso, no disponible. La Torá te entrena en paciencia productiva.",practica:"No exprimas lo que empieza. Un proyecto, una persona nueva, tu propio aprendizaje. Deja 3 días / 3 semanas antes de exigir fruto."},profunda:{hebrew:"וְעָרַלְתֶּם עָרְלָתוֹ",comment:"Rambam: educación contra la codicia inmediata. Ramban: el árbol necesita establecer raíces, no frutos.",root:"ע-ר-ל: cerrado, no accesible. Como brit milá, apertura que lleva tiempo."},practica7:["Día 1: Identifica tu orlá","Día 2: No coseches hoy","Día 3: Riega sin esperar","Día 4: Protege lo joven","Día 5: Celebra la espera","Día 6: Planta algo nuevo","Día 7: Suelta expectativa"]},{id:"2.3",blockId:2,heLetter:"נ",titleHe:"Netiá (נְטִיעָה)",titleEs:"Plantar es rezar",verse:"Vayikra 19:23 / Talmud",subtitle:"Cuando entréis a la tierra, plantaréis.",category:"Naturaleza",abierta:{intro:"Incluso si te dicen que mañana llega el Mashiaj, planta un árbol hoy. Netiá es fe en futuro que no verás completo. Es el acto más ecológico y espiritual.",practica:"Planta algo hoy: una semilla, una idea en alguien, un hábito. No para ti, para quien viene."},profunda:{hebrew:"כִּי תָבֹאוּ אֶל־הָאָרֶץ וּנְטַעְתֶּם",comment:"Midrash: Dios mismo planta primero. Tú imitas. Plantar es la primera y última mitzvá.",root:"נ-ט-ע: clavar, fijar, arraigar. De ahí matá — plantación que se queda."},practica7:["Día 1: Planta","Día 2: Cuida lo plantado","Día 3: Planta en otro (enseña)","Día 4: Planta sin que te vean","Día 5: Planta algo difícil","Día 6: Visita lo que plantaste","Día 7: Bendice tu plantación"]},{id:"2.4",blockId:2,heLetter:"כ",titleHe:"Bal Tashjit Ilan",titleEs:"No cortes frutal",verse:"Devarim 20:19-20",subtitle:"El humano es árbol del campo.",category:"Naturaleza",abierta:{intro:"¿Eres tú árbol del campo para sitiarte? La Torá compara humano y árbol. Cortar un frutal sin necesidad es cortarte a ti. Prohibición ecológica explícita.",practica:"Hoy no cortes, poda. No elimines, cuida. Si debes cortar, planta otro antes."},profunda:{hebrew:"כִּי הָאָדָם עֵץ הַשָּׂדֶה",comment:"Rashi: metáfora — como el árbol da, tú das. Ramban literal: el árbol frutal es vida, no lo cortes por estrategia.",root:"כ-ר-ת: cortar pacto o árbol. Todo corte es pacto roto si no es necesario."},practica7:["Día 1: No cortes nada","Día 2: Poda con respeto","Día 3: Abraza un árbol","Día 4: Come fruto con bendición completa","Día 5: Protege un árbol urbano","Día 6: Planta frutal","Día 7: Medita: tú eres árbol"]}]},{id:3,title:"AIRE Y PALABRA",subtitle:"La ecología de tu boca",heLetter:"פ",category:"Persona",desc:"El aire más contaminado es el que sale de ti cuando hablas mal.",fichas:[{id:"3.1",blockId:3,heLetter:"ל",titleHe:"Lashón HaRá (לָשׁוֹן הָרָע)",titleEs:"No contamines el aire con tu boca",verse:"Vayikra 19:16",subtitle:"No irás chismeando entre tu pueblo.",category:"Persona",abierta:{intro:"El chisme contamina más que el plástico. Se queda en el aire, viaja, no se recoge. Lashón HaRá destruye ecología social.",practica:"Ayuno de lashón hará hoy: 3 horas sin hablar de terceros. Si lo haces, corrige: di algo bueno de esa persona."},profunda:{hebrew:"לֹא תֵלֵךְ רָכִיל בְּעַמֶּיךָ",comment:"Jafetz Jaim: rakhil — mercader que va de puerta en puerta con mercancías. El chismoso comercia con personas.",root:"ר-כ-ל: ir, mercadear, traficar. Lashón hará es trata de personas con palabras."},practica7:["Día 1: 1h sin lashón hará","Día 2: 3h","Día 3: Mañana completa","Día 4: Defiende a ausente","Día 5: Habla bien de alguien difícil","Día 6: Pide perdón por chisme","Día 7: Día entero limpio"]},{id:"3.2",blockId:3,heLetter:"א",titleHe:"Onaat Devarim (אוֹנָאַת דְּבָרִים)",titleEs:"No hieras con palabras",verse:"Vayikra 25:17",subtitle:"No oprimáis cada uno a su compañero.",category:"Persona",abierta:{intro:"Puedes devolver dinero robado. Palabras que hieren no se devuelven. Onaat devarim es opresión verbal: humillar, recordar errores, poner apodos.",practica:"Hoy no corrijas en público. No uses sarcasmo. Si hieres, repara en el mismo lugar donde heriste."},profunda:{hebrew:"וְלֹא תוֹנוּ אִישׁ אֶת־עֲמִיתוֹ",comment:"Rashi: onaat devarim es peor que onaat mamón (dinero) porque el cuerpo no se recupera. Talmud: avergonzar en público es como derramar sangre.",root:"י-נ-ה: oprimir, presionar, angostar. Palabra que angosta el alma del otro."},practica7:["Día 1: No corrijas","Día 2: No avergüences","Día 3: Elogia en público","Día 4: Pregunta antes de aconsejar","Día 5: Escucha sin interrumpir","Día 6: Pide perdón por palabra hiriente","Día 7: Bendice con palabras"]},{id:"3.3",blockId:3,heLetter:"ש",titleHe:"Shemirat Halashón",titleEs:"Silencio fértil",verse:"Tehilim 34:14",subtitle:"Guarda tu lengua del mal.",category:"Persona",abierta:{intro:"No se trata de no hablar, sino de guardar la lengua como se guarda un jardín. Silencio fértil no es vacío, es tierra donde crece otra palabra mejor.",practica:"Practica 5 minutos de silencio antes de responder. No respondas de inmediato. Deja que el aire se limpie."},profunda:{hebrew:"נְצֹר לְשׁוֹנְךָ מֵרָע",comment:"Rambam: el silencio es cerca para la sabiduría. Jafetz Jaim: shemirat halashón trae shemirat hanefesh.",root:"נ-צ-ר: guardar, preservar, como nézer — corona. Lengua guardada es corona."},practica7:["Día 1: 5 min silencio mañana","Día 2: Silencio antes de cada respuesta difícil","Día 3: Medita sin palabras","Día 4: Escucha 100% sin preparar respuesta","Día 5: No hables de ti por 1h","Día 6: Silencio en discusión","Día 7: Shabat de palabras — solo necesarias"]},{id:"3.4",blockId:3,heLetter:"ק",titleHe:"Kol (קוֹל)",titleEs:"Tu voz crea mundos",verse:"Mishlei 18:21",subtitle:"Muerte y vida en mano de la lengua.",category:"Persona",abierta:{intro:"Si tu palabra puede destruir, también puede construir. Kol es voz, pero también eco. Lo que dices vuelve. Usa tu voz para crear, no para contaminar.",practica:"Hoy di 3 bendiciones reales: agradece en voz alta algo específico, bendice a alguien por su nombre, bendice tu comida con kavaná."},profunda:{hebrew:"מָוֶת וְחַיִּים בְּיַד־לָשׁוֹן",comment:"Seforno: la lengua tiene mano — agarra, construye, mata. Kol es herramienta de creación como en Bereshit: Vayomer — y dijo.",root:"ק-ו-ל: voz, sonido, pero también ligero — lo ligero que pesa más que lo pesado."},practica7:["Día 1: 3 bendiciones conscientes","Día 2: Canta","Día 3: Reza en voz alta","Día 4: Agradece en voz alta","Día 5: Pide perdón en voz alta","Día 6: Bendice a tus hijos/pareja","Día 7: Silencio y luego una bendición larga"]}]},{id:4,title:"TIEMPO Y DINERO",subtitle:"Soltar para sostener",heLetter:"ז",category:"Sociedad",desc:"El tiempo no es oro. El tiempo es tierra que descansa.",fichas:[{id:"4.1",blockId:4,heLetter:"ש",titleHe:"Shmitá (שְׁמִטָּה)",titleEs:"Dejar descansar",verse:"Shemot 23:11",subtitle:"La tierra descansará Shabat para Dios.",category:"Sociedad",abierta:{intro:"Cada 7 años, la tierra no se trabaja. No es crisis, es diseño. Shmitá enseña que la productividad infinita destruye. Necesitas años sabáticos.",practica:"Haz tu shmitá hoy: una hora sin producir, sin comprar, sin optimizar. Deja que algo descanse: tu celular, tu agenda, tu exigencia."},profunda:{hebrew:"וּבַשָּׁנָה הַשְּׁבִיעִת תִּשְׁמְטֶנָּה וּנְטַשְׁתָּהּ",comment:"Ramban: la tierra es de Dios, tú eres arrendatario. Shmitá recuerda quién es dueño. Seforno: descanso que fertiliza.",root:"ש-מ-ט: soltar, dejar caer, dejar libre. Dejar que caiga lo que sostenías por control."},practica7:["Día 1: 1h sin producción","Día 2: No compres","Día 3: Deja descansar a alguien (delega)","Día 4: Shmitá digital 2h","Día 5: No controles un resultado","Día 6: Descanso total 3h","Día 7: Shabat completo"]},{id:"4.2",blockId:4,heLetter:"י",titleHe:"Yovel (יוֹבֵל)",titleEs:"Todo vuelve",verse:"Vayikra 25:10",subtitle:"Proclamaréis libertad en la tierra.",category:"Sociedad",abierta:{intro:"Cada 50 años, todo vuelve a su lugar: tierras, deudas, esclavos. Yovel es reset social. Sin Yovel, la desigualdad se eterniza.",practica:"Haz un mini yovel: perdona una deuda pequeña, devuelve algo que no es tuyo, libera a alguien de una obligación que ya no tiene sentido."},profunda:{hebrew:"וּקְרָאתֶם דְּרוֹר בָּאָרֶץ",comment:"Rashi: dror es golondrina que vuelve a casa. Yovel es volver a casa. Rambam: sin Yovel no hay justicia económica.",root:"י-ב-ל: llevar, conducir, carnero cuyo cuerno anuncia libertad."},practica7:["Día 1: Perdona deuda","Día 2: Libera a alguien de promesa","Día 3: Devuelve tierra/silla/lugar","Día 4: No acumules","Día 5: Libérate de algo","Día 6: Anuncia libertad","Día 7: Vuelve a tu centro"]},{id:"4.3",blockId:4,heLetter:"ר",titleHe:"Ribbit (רִבִּית)",titleEs:"Dinero no pare dinero",verse:"Shemot 22:24",subtitle:"No serás para él como prestamista.",category:"Sociedad",abierta:{intro:"Cobrar interés al necesitado es hacer que el dinero tenga hijos sin trabajar. La Torá prohíbe ribbit entre hermanos. El dinero debe servir, no reproducirse solo.",practica:"Hoy presta sin interés: tiempo, dinero, atención. No calcules retorno. Observa qué pasa cuando no pones precio a todo."},profunda:{hebrew:"אִם־כֶּסֶף תַּלְוֶה אֶת־עַמִּי",comment:"Rashi: et-amí — mira si es de mi pueblo, necesitado. Seforno: ribbit corrompe la fraternidad.",root:"ר-ב-ה: multiplicar. Ribbit es multiplicación sin bendición."},practica7:["Día 1: Presta sin interés","Día 2: No cobres favor","Día 3: Da sin calcular","Día 4: No especules","Día 5: Ayuda sin que te deba","Día 6: Perdona interés emocional (no guardes cuenta)","Día 7: Shabat sin transacciones"]},{id:"4.4",blockId:4,heLetter:"צ",titleHe:"Tzedaká (צְדָקָה)",titleEs:"Justicia circular",verse:"Devarim 15:8",subtitle:"Abrirás tu mano.",category:"Sociedad",abierta:{intro:"Tzedaká no es caridad, es justicia. No das porque te sobra, das porque el otro tiene derecho a que la abundancia circule. Es riego, no limosna.",practica:"Da hoy el 10% de algo: tiempo, comida, dinero. No por lástima, por justicia. Hazlo circular."},profunda:{hebrew:"פָּתֹחַ תִּפְתַּח אֶת־יָדְךָ",comment:"Rambam: 8 niveles, el más alto es dar trabajo, no limosna. Tzedaká repara la circulación.",root:"צ-ד-ק: justicia, rectitud. Tzedek, no jesed. Derecho, no favor."},practica7:["Día 1: Da dinero","Día 2: Da tiempo","Día 3: Da trabajo/contacto","Día 4: Da anónimo","Día 5: Da aunque te cueste","Día 6: Enseña a dar","Día 7: Recibe tzedaká (aprende a recibir)"]}]},{id:5,title:"CUERPO",subtitle:"Tu cuerpo es adamá",heLetter:"ג",category:"Persona",desc:"No tienes un cuerpo. Eres tierra que respira.",fichas:[{id:"5.1",blockId:5,heLetter:"ג",titleHe:"Shmirat Haguf (שְׁמִירַת הַגּוּף)",titleEs:"Tu cuerpo es adamá",verse:"Devarim 4:15",subtitle:"Guardad mucho vuestras almas.",category:"Persona",abierta:{intro:"La Torá manda cuidar el cuerpo como se cuida la tierra: sin tóxicos, con descanso, con alimento limpio. Tu cuerpo es la primera ecología.",practica:"Hoy cuida tu adamá: agua, sueño, movimiento, no intoxicar. Una acción concreta de cuidado corporal."},profunda:{hebrew:"וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם",comment:"Rambam: es mitzvá cuidar la salud. No es opcional espiritual, es obligación.",root:"ש-מ-ר + ג-ו-ף: guardar el envoltorio que guarda el alma."},practica7:["Día 1: Agua suficiente","Día 2: Sueño 7h","Día 3: Movimiento suave","Día 4: No tóxico","Día 5: Aire libre","Día 6: Contacto tierra","Día 7: Shabat corporal"]},{id:"5.2",blockId:5,heLetter:"א",titleHe:"Ajilá (אֲכִילָה)",titleEs:"Lo que entra",verse:"Vayikra 11:44",subtitle:"Seréis santos porque Yo soy santo.",category:"Persona",abierta:{intro:"No es solo qué comes, es cómo comes. Ajilá consciente es ecología interna. Lo que entra te hace tierra fértil o tierra contaminada.",practica:"Come una comida hoy sin pantalla, con bendición lenta, masticando, agradeciendo cada ingrediente y mano que lo trajo."},profunda:{hebrew:"וְהִתְקַדִּשְׁתֶּם וִהְיִיתֶם קְדֹשִׁים",comment:"Seforno: santidad empieza en la boca. Ramban: no seas naval birshut haTorá — vil con permiso de la Torá, comiendo sin límite.",root:"א-כ-ל: consumir, pero también terminar. Lo que comes te termina a ti."},practica7:["Día 1: Come sin pantalla","Día 2: Bendice lento","Día 3: Menos cantidad más calidad","Día 4: No comas con culpa","Día 5: Cocina tu comida","Día 6: Comparte mesa","Día 7: Ayuno breve y agradecimiento"]},{id:"5.3",blockId:5,heLetter:"מ",titleHe:"Menujá (מְנוּחָה)",titleEs:"Pausa que repara",verse:"Bereshit 2:3",subtitle:"Y descansó en el séptimo día.",category:"Persona",abierta:{intro:"Menujá no es no hacer nada, es hacer que el hacer descanse. Pausa que repara, no que colapsa. Sin menujá, tu adamá se agrieta.",practica:"Programa hoy 3 menujot: 5 min mañana, 10 min tarde, 20 min noche. Sin objetivo, solo estar."},profunda:{hebrew:"וַיִּשְׁבֹּת בַּיּוֹם הַשְּׁבִיעִי",comment:"Rashi: ¿qué faltaba? Menujá. Llegó Shabat, llegó descanso. No es ausencia, es presencia.",root:"נ-ו-ח: descansar, posarse, como Noaj — descanso que salva del diluvio."},practica7:["Día 1: 3 pausas","Día 2: Pausa sin celular","Día 3: Pausa al aire libre","Día 4: Pausa con respiración","Día 5: Pausa con alguien","Día 6: Pausa larga","Día 7: Shabat"]},{id:"5.4",blockId:5,heLetter:"ק",titleHe:"Kedushá (קְדֻשָּׁה)",titleEs:"Cuerpo como templo",verse:"Shemot 25:8",subtitle:"Me harán un santuario y habitaré en ellos.",category:"Persona",abierta:{intro:"No harás templo afuera si no santificas adentro. Tu cuerpo es mishkán pequeño. Kedushá es tratarlo con respeto de lugar sagrado.",practica:"Trata tu cuerpo hoy como santuario: límpialo, vístelo con dignidad, no lo uses para descargar ira."},profunda:{hebrew:"וְעָשׂוּ לִי מִקְדָּשׁ וְשָׁכַנְתִּי בְּתוֹכָם",comment:"No dice betojó — en él, sino betojam — en ellos. Dentro de cada uno.",root:"ק-ד-ש: separado para propósito. Tu cuerpo separado para bendecir."},practica7:["Día 1: Viste con intención","Día 2: Limpia tu espacio corporal","Día 3: No hables mal de tu cuerpo","Día 4: Mueve como rezo","Día 5: Descansa como ritual","Día 6: Ama tu adamá","Día 7: Habita tu templo"]}]},{id:6,title:"TRABAJO",subtitle:"Dignidad del que trabaja",heLetter:"ע",category:"Sociedad",desc:"El trabajo no es castigo. Es sociedad.",fichas:[{id:"6.1",blockId:6,heLetter:"ב",titleHe:"Beyomo Titen Sejaro (בְּיוֹמוֹ תִתֵּן שְׂכָרוֹ)",titleEs:"Pagar a tiempo",verse:"Devarim 24:15",subtitle:"En su día darás su salario.",category:"Sociedad",abierta:{intro:"Retener sueldo es retener vida. La Torá lo dice brutal: el trabajador levanta su alma hacia su paga. Si no le pagas a tiempo, juegas con su vida.",practica:"Hoy paga todo a tiempo: sueldos, favores, agradecimientos. No retengas lo que debes. Si debes un mensaje, págalo hoy."},profunda:{hebrew:"בְּיוֹמוֹ תִתֵּן שְׂכָרוֹ וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ",comment:"Rashi: cada hora que retienes, es como si tomaras su alma. Talmud: quien retiene salario es como adorador de ídolos — confía en el dinero, no en la vida.",root:"ש-כ-ר: salario, pero también embriaguez — el que no paga se embriaga de poder."},practica7:["Día 1: Paga todo hoy","Día 2: Agradece a quien te sirve","Día 3: No pidas fiado sin acordar","Día 4: Paga extra por buen trabajo","Día 5: Reconoce trabajo invisible","Día 6: Paga tu deuda emocional","Día 7: Deja que te paguen (recibe)"]},{id:"6.2",blockId:6,heLetter:"ע",titleHe:"Eved Ivri (עֶבֶד עִבְרִי)",titleEs:"Todo contrato tiene salida",verse:"Shemot 21:2",subtitle:"Seis años trabajará y al séptimo saldrá libre.",category:"Sociedad",abierta:{intro:"Máximo 6 años. Ningún contrato puede ser eterno. La Torá inventa el contrato temporal con salida digna. Si tu trabajo no tiene salida, no es trabajo, es esclavitud.",practica:"Revisa un contrato tuyo: laboral, emocional, familiar. ¿Tiene fecha de revisión? ¿Tiene salida? Ponle límite sano."},profunda:{hebrew:"כִּי תִקְנֶה עֶבֶד עִבְרִי שֵׁשׁ שָׁנִים יַעֲבֹד",comment:"Rambam: la puerta de salida es la que hace humano el contrato. Seforno: 6 años — como 6 días de trabajo, luego Shabat.",root:"ע-ב-ד: trabajar, servir, pero también cultivar. Mismo verbo que leovdá en Bereshit."},practica7:["Día 1: Revisa contrato","Día 2: Pon fecha de revisión","Día 3: Negocia salida","Día 4: No firmes eterno","Día 5: Libera a alguien","Día 6: Libérate tú","Día 7: Shabat — sin contrato"]},{id:"6.3",blockId:6,heLetter:"מ",titleHe:"Menujá para todos",titleEs:"Descanso para buey, siervo y extranjero",verse:"Shemot 20:10",subtitle:"No harás trabajo tú, ni tu hijo, ni tu siervo, ni tu buey.",category:"Sociedad",abierta:{intro:"Shabat no es solo para ti. Es para todos los que dependen de ti: tu empleado, tu animal, tu extranjero. Si tu descanso depende de que otro trabaje, no es Shabat.",practica:"Este Shabat, asegura descanso a tu entorno: no hagas que otros trabajen para tu ocio. Descanso colectivo."},profunda:{hebrew:"לֹא תַעֲשֶׂה כָל־מְלָאכָה אַתָּה וּבִנְךָ וּבִתֶּךָ עַבְדְּךָ וַאֲמָתְךָ וּבְהֶמְתֶּךָ",comment:"Rashi: si tu buey descansa pero tu empleado no, no entendiste nada. Shabat es huelga general sagrada.",root:"מ-ל-א-כ-ה: trabajo creador. En Shabat cesa la creación para recordar quién crea."},practica7:["Día 1: No hagas trabajar a otro para ti en tu descanso","Día 2: Da descanso a quien te ayuda","Día 3: Descanso animal (cuida a tu mascota)","Día 4: Descanso para el extranjero (acoge)","Día 5: Descanso sin consumo","Día 6: Prepara Shabat para todos","Día 7: Shabat colectivo"]},{id:"6.4",blockId:6,heLetter:"ל",titleHe:"Lo Taashok (לֹא תַעֲשֹׁק)",titleEs:"No oprimir",verse:"Vayikra 19:13",subtitle:"No oprimirás a tu prójimo.",category:"Sociedad",abierta:{intro:"Oprimir no es solo pagar mal. Es no dar herramientas, no enseñar, no dejar crecer. El opresor retiene información, tiempo, poder.",practica:"Hoy da herramienta, no solo orden. Enseña cómo, no solo qué. No oprimas con tu saber retenido."},profunda:{hebrew:"לֹא תַעֲשֹׁק אֶת־רֵעֲךָ וְלֹא תִגְזֹל",comment:"Ramban: oshek es retener lo que el otro necesita para vivir — salario, herramienta, oportunidad. Seforno: incluye opresión emocional.",root:"ע-ש-ק: oprimir, presionar, exprimir. De ahí oshek — exprimir al otro hasta que no dé más."},practica7:["Día 1: Da herramienta","Día 2: Enseña","Día 3: No retengas info","Día 4: Paga justo","Día 5: Reconoce","Día 6: Libera presión","Día 7: No oprimas ni a ti mismo"]}]},{id:7,title:"CIUDAD",subtitle:"Cómo vivir juntos",heLetter:"ע",category:"Sociedad",desc:"Una ciudad sin barandas no es libre, es peligrosa.",fichas:[{id:"7.1",blockId:7,heLetter:"מ",titleHe:"Maaké (מַעֲקֶה)",titleEs:"Baranda en tu techo",verse:"Devarim 22:8",subtitle:"Harás baranda a tu azotea.",category:"Sociedad",abierta:{intro:"Safety by design. Antes de que alguien caiga, pon baranda. La Torá no espera accidente, previene. Tu casa, tu producto, tu palabra necesitan maaké.",practica:"Hoy pon una baranda: aviso, límite, protección en algo que podría hacer caer a otro. Previene un accidente."},profunda:{hebrew:"כִּי יִפֹּל הַנֹּפֵל מִמֶּנּוּ",comment:"Rashi: el que cae ya era caído — tú solo quitaste la baranda. Responsabilidad del diseñador.",root:"ע-ק-ה: rodear, proteger. Maaké — lo que rodea para que no caiga."},practica7:["Día 1: Revisa riesgos en tu casa","Día 2: Pon baranda física","Día 3: Pon baranda digital (límites)","Día 4: Avisa de peligro","Día 5: No dejes techo sin baranda (proyecto sin cierre)","Día 6: Enseña safety","Día 7: Descansa seguro"]},{id:"7.2",blockId:7,heLetter:"ע",titleHe:"Ir Miklat (עִיר מִקְלָט)",titleEs:"Ciudades de refugio",verse:"Devarim 19:1-3",subtitle:"Prepararás el camino.",category:"Sociedad",abierta:{intro:"Si alguien mata sin querer, que pueda huir a ciudad de refugio. La Torá corta la venganza con urbanismo: caminos señalizados, ciudades accesibles. Justicia restaurativa.",practica:"Crea hoy una ir miklat: un espacio donde alguien pueda equivocarse sin ser linchado. En tu casa, trabajo, chat."},profunda:{hebrew:"תָּכִין לְךָ הַדֶּרֶךְ",comment:"Rashi: prepara el camino — señalizado, sin obstáculos. Que el que huye no se pierda. Justicia que facilita, no que complica.",root:"ק-ל-ט: absorber, acoger. Miklat — lugar que absorbe la culpa sin venganza."},practica7:["Día 1: Señaliza un refugio","Día 2: No vengues","Día 3: Acoge al que se equivocó","Día 4: Facilita camino","Día 5: Corta rumor","Día 6: Ofrece segunda oportunidad","Día 7: Sé refugio"]},{id:"7.3",blockId:7,heLetter:"ל",titleHe:"Lifnei Iver (לִפְנֵי עִוֵּר)",titleEs:"No pongas tropiezo",verse:"Vayikra 19:14",subtitle:"Delante del ciego no pondrás tropiezo.",category:"Sociedad",abierta:{intro:"Ética UX milenaria. No pongas obstáculo frente a quien no ve. No des consejo malo a quien confía en ti. No hagas diseño que hace tropezar.",practica:"Revisa hoy dónde pones tropiezos: información confusa, precios ocultos, instrucciones que hacen caer. Quítalos."},profunda:{hebrew:"וְלִפְנֵי עִוֵּר לֹא תִתֵּן מִכְשֹׁל",comment:"Rashi: ciego — el que no sabe. No le des consejo que le hace perder. Rambam: incluye hacer que otro peque.",root:"כ-ש-ל: tropezar, hacer caer. Mijshol — piedra de tropiezo."},practica7:["Día 1: Quita un tropiezo físico","Día 2: Quita tropiezo informativo","Día 3: No aconsejes mal","Día 4: Señaliza peligro","Día 5: Haz accesible","Día 6: No manipules","Día 7: Guía bien"]},{id:"7.4",blockId:7,heLetter:"ה",titleHe:"Hashavat Aveidá (הֲשָׁבַת אֲבֵדָה)",titleEs:"Devolver lo perdido",verse:"Devarim 22:1",subtitle:"No podrás esconderte.",category:"Sociedad",abierta:{intro:"Ves algo perdido y te escondes. La Torá dice: lo taajov lehitalem — no podrás esconderte. Devolver lo perdido es economía circular y alma circular.",practica:"Hoy devuelve algo perdido: objeto, oportunidad, palabra que alguien perdió. No te escondas."},profunda:{hebrew:"לֹא תוּכַל לְהִתְעַלֵּם",comment:"Rashi: no cierres ojos. Talmud: aunque te cuesta, debes devolver. Es devolver mundo a su dueño.",root:"א-ב-ד: perdido, pero no desaparecido. Aveidá — lo que espera ser encontrado."},practica7:["Día 1: Devuelve objeto","Día 2: Devuelve crédito","Día 3: Devuelve tiempo","Día 4: No te escondas","Día 5: Busca dueño","Día 6: Anuncia hallazgo","Día 7: Agradece lo devuelto"]}]},{id:8,title:"OBJETOS",subtitle:"La segunda vida de las cosas",heLetter:"כ",category:"Objetos",desc:"Nada es basura si sabes mirar su alma.",fichas:[{id:"8.1",blockId:8,heLetter:"ש",titleHe:"Shaatnez (שַׁעַטְנֵז)",titleEs:"No mezclar lana y lino",verse:"Devarim 22:11",subtitle:"No vestirás shaatnez.",category:"Objetos",abierta:{intro:"Lana y lino no se mezclan en una prenda. ¿Por qué? Trazabilidad. Cada material tiene alma distinta, origen distinto. No los confundas.",practica:"Hoy separa materiales: revisa etiquetas, no mezcles lo que no va. Honra el origen de lo que usas."},profunda:{hebrew:"לֹא תִלְבַּשׁ שַׁעַטְנֵז",comment:"Ramban: Caín trajo lino, Hevel lana — mezcla de celos. No mezcles mundos que no dialogan. Rashi: decreto sin razón, entrena obediencia a la materia.",root:"ש-ע-ט-נ-ז: peinado, tejido, retorcido — mezcla confusa."},practica7:["Día 1: Revisa etiquetas","Día 2: Separa materiales","Día 3: No compres mezcla confusa","Día 4: Honra origen","Día 5: Usa puro","Día 6: Recicla separado","Día 7: Viste con conciencia"]},{id:"8.2",blockId:8,heLetter:"כ",titleHe:"Kilayim (כִּלְאַיִם)",titleEs:"No mezclar semillas",verse:"Vayikra 19:19",subtitle:"Tu campo no sembrarás kilayim.",category:"Objetos",abierta:{intro:"Biodiversidad antes que monocultivo. No siembres dos especies juntas que compiten. Cada semilla necesita su espacio, su tiempo.",practica:"No mezcles proyectos que compiten hoy. Dale a cada semilla su surco. No hagas kilayim en tu agenda."},profunda:{hebrew:"אֶת־חֻקֹּתַי תִּשְׁמֹרוּ",comment:"Rambam: kilayim protege diversidad genética. Seforno: cada especie alaba a su modo, no las confundas.",root:"כ-ל-א: encerrar, prisión. Kilayim — encerrar dos en una prisión que no les corresponde."},practica7:["Día 1: Separa proyectos","Día 2: No fuerces mezcla","Día 3: Respeta diversidad","Día 4: Planta puro","Día 5: No clones sin permiso","Día 6: Deja que cada cosa sea","Día 7: Contempla variedad"]},{id:"8.3",blockId:8,heLetter:"ל",titleHe:"Lo Tajarosh (לֹא תַחֲרֹשׁ)",titleEs:"No arar con buey y asno",verse:"Devarim 22:10",subtitle:"No ara
