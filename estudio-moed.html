l mes",desc:"Di en voz alta el nombre del mes hebreo. Nisán, Iyar, Siván... cada nombre es un clima interior."},{day:3,title:"Oscuridad fértil",desc:"Escribe 3 cosas que terminaron. Agradéceles. La luna empieza en negro."},{day:4,title:"Hilel menor",desc:"Recita Hallel abreviado o un salmo 113. Canta lo pequeño que crece."},{day:5,title:"Mujeres y luna",desc:"Tradición: Rosh Jodesh es fiesta de las mujeres. Pregunta a una mujer de tu vida qué quiere renovar."},{day:6,title:"Kiddush Levana",desc:"Si puedes, di Kidush Levaná bajo la luna. Si no, escribe: 'Renuevo mi alianza con el tiempo'."},{day:7,title:"Semilla del mes",desc:"Una sola kavaná para este mes. Una frase. Ej: Este mes de Elul, escucho antes de responder."}]},{id:"pesaj",num:2,titleEs:"Pesaj",titleHeLatin:"Libertad",hebrew:"פסח",hebrewFull:"פסח",tag:"Salir",abierta:"Salir de lo estrecho. Mitzrayim es meitzar - angostura. No es historia, es ahora. Cada uno debe verse como si él mismo salió de Egipto hoy.",profunda:"Devarim 16: La Torá ordena recordar que fuiste esclavo. El Seder no es cena, es teatro de la memoria: 4 copas, Matzá - lejem oni, pan de la pobreza y de la fe, Maror - amargura que no se endulza. Rambam dice que Jirut es poder hacer lo que tu mente decide, no lo que tu miedo ordena. Seforno: la libertad judía es libertad con memoria, no olvido. Si olvidas de dónde saliste, vuelves a esclavizarte.",sources:["Devarim 16:1-8 — Shamor et jodesh haaviv","Hagadá — Bejol dor vador","Rambam, Hiljot Jametz uMatzá","Seforno sobre Shemot 12 — Jirut hanefesh"],practicaIntro:"Limpieza de jametz interno, contar tu propio éxodo.",color:"#F1E4C6",practica7:[{day:1,title:"Bedikat jametz",desc:"Busca tu jametz: ¿Qué relato inflado te cuentas? Escríbelo y dóblalo."},{day:2,title:"Biur",desc:"Quema simbólicamente una de esas historias. No la niegues, transfórmala."},{day:3,title:"4 preguntas",desc:"Formula tus 4 Ma Nishtaná personales: ¿Qué es diferente esta noche en mi vida?"},{day:4,title:"Matzá",desc:"Come algo simple y lento. Sin apuro. La libertad no tiene levadura."},{day:5,title:"Maguid",desc:"Cuenta tu éxodo a alguien: ¿De qué saliste este año?"},{day:6,title:"Dayenu",desc:"Lista 10 dayenus: hubiera sido suficiente con... Entrena gratitud desmedida."},{day:7,title:"Shir",desc:"Canta Shirat HaYam. La libertad termina en canto, no en discurso."}]},{id:"shavuot",num:3,titleEs:"Shavuot",titleHeLatin:"Entrega",hebrew:"שבוע",hebrewFull:"שבועות",tag:"Cosechar adentro",abierta:"49 días contando, del grano a la Torá. De cosechar afuera a cosechar adentro. En Pesaj cosechas cebada, en Shavuot traes tu primer fruto humano.",profunda:"Vayikra 23:15 — Usefartem lajem mimajarat haShabat. Sefirat HaOmer es contar la distancia entre salir y recibir. No basta con salir de Egipto, hay que llegar a Sinaí. Kabalat HaTorá no es pasado, es presente continuo. El libro de Rut se lee en Shavuot: una moabita elige pertenecer. Bikurim - traer primicias - es decir: esto primero no es mío, es ofrenda. La Torá es como agua, dicen Jajamim: va hacia lo bajo, hacia el humilde.",sources:["Vayikra 23:15-21 — Sefirat HaOmer","Talmud Shabat 88a — Kabalat HaTorá","Meguilat Rut — bikurim y jesed","Midrash — Ein mayim ela Torá"],practicaIntro:"Estudio nocturno, traer primeros frutos.",color:"#E8EEDD",practica7:[{day:1,title:"Omer diario",desc:"Cuenta hoy: hoy son X días del Omer. No cuentes automático. Detente."},{day:2,title:"Rut",desc:"Lee un capítulo de Rut. ¿A quién eliges acompañar: Adonde vayas iré?"},{day:3,title:"Agua",desc:"Estudia 15 minutos de Torá como quien bebe agua. Sin meta de terminar."},{day:4,title:"Bikurim",desc:"Trae un primer fruto: algo que hiciste por primera vez este año. Ofrécelo."},{day:5,title:"Naasé Venishmá",desc:"Haz antes de entender. Una mitzvá sin entenderla del todo hoy."},{day:6,title:"Tikkun Leil Shavuot",desc:"Noche en vela: estudia 3 textos cortos con alguien. Que la noche sostenga."},{day:7,title:"Matán",desc:"Escribe tu propio Aseret HaDibrot: 10 frases que quieres recibir como ley interior."}]},{id:"sucot",num:4,titleEs:"Sucot",titleHeLatin:"Fragilidad",hebrew:"סכה",hebrewFull:"סוכות",tag:"Abrazo frágil",abierta:"Vivir 7 días en una cabaña frágil para recordar que lo frágil te cuida. Conecta con Adam Adamá - tierra que te sostiene. La sucá no protege del viento, te enseña a confiar en el viento.",profunda:"Vayikra 23:42 — Basukot teshvu shivat yamim. Zohar dice que la Sucá es el abrazo de Dios, jibuka. 7 Ushpizin: Avraham, Yitzjak, Yaakov, Moshe, Aharon, Yosef, David - invitas ancestros a tu fragilidad. Arba Minim: etrog, lulav, hadas, aravá - cuatro tipos de judíos, cuatro partes del cuerpo, cuatro caracteres, todos atados juntos. Sin uno, no hay mitzvá. La sucá debe tener más sombra que sol, y ver estrellas por el sjaj.",sources:["Vayikra 23:42-43 — Lemaán yedu doroteijem","Zohar Emor — Sucá como abrazo","Talmud Sucá 11b — Ushpizin","Midrash sobre Arba Minim"],practicaIntro:"Comer en Sucá, invitar, mirar estrellas por el techo.",color:"#E5DDCB",practica7:[{day:1,title:"Construir",desc:"Levanta algo frágil hoy: una mesa simple, un techo de ramas. Que no sea perfecto."},{day:2,title:"Leshev",desc:"Come una comida completa en la sucá o cerca de una ventana mirando cielo. Sin celular."},{day:3,title:"Ushpizin",desc:"Invita hoy a un huésped real y a uno ancestral. ¿Qué le preguntarías a Avraham en tu sucá?"},{day:4,title:"Arba Minim",desc:"Toma 4 objetos distintos (fruta, rama, hoja, vara) y átalos. ¿Qué partes tuyas necesitan estar juntas?"},{day:5,title:"Noche estrellada",desc:"Mira estrellas por el sjaj o techo. Cuenta 3 que veas. Recuerda: Avraham contó estrellas."},{day:6,title:"Fragilidad que cuida",desc:"Escribe: ¿Qué estructura frágil de tu vida te cuida más que las sólidas?"},{day:7,title:"Simjá",desc:"Sucot es Zman Simjatenu. Baila 2 minutos sin motivo. La alegría como mitzvá."}]},{id:"yamim-noraim",num:5,titleEs:"Yamim Noraim",titleHeLatin:"Días temibles y dulces",hebrew:"ימים",hebrewFull:"ימים נוראים",tag:"Retorno",abierta:"Rosh Hashaná no es fin de año, es cabeza de año. Yom Kippur no es culpa, es limpieza. Teshuvá no es arrepentimiento, es volver. Volver a tu lugar.",profunda:"Shofar: 100 sonidos. Tekiá - entero, Shevarim - quebrado, Teruá - sollozo. Rambam en Hiljot Teshuvá dice que el Shofar dice: despierten dormidos. Kol Nidrei no anula promesas a personas, anula votos precipitados con lo divino. Vidui es confesión en plural: ashamnu, bagadnu - porque mi error es parte de un cuerpo. El Libro de la Vida no es amenaza, es recordatorio: tu vida escribe. El juicio es dulce si te atreves a nombrarte.",sources:["Rambam, Hiljot Teshuvá 1-2 — Teshuvá como retorno","Talmud Rosh Hashaná 16b — 100 kolot shofar","Majzor — Kol Nidrei y Vidui","Bereshit Rabá — Sefer HaJaim"],practicaIntro:"10 días de retorno, pedir perdón concreto.",color:"#EADFD8",practica7:[{day:1,title:"Shofar",desc:"Escucha un shofar grabado. 30 segundos de silencio después. ¿Qué despertó?"},{day:2,title:"Jeshbón",desc:"Balance no financiero: ¿A quién le debes una palabra? ¿A quién le debes un límite?"},{day:3,title:"Slijá concreta",desc:"Pide perdón a una persona específica, sin justificarte. Frase corta: te lastimé cuando..."},{day:4,title:"Vidui personal",desc:"Escribe tu propio vidui en plural: nos equivocamos cuando..."},{day:5,title:"Tashlij",desc:"Ve a agua corriente. Tira migas o piedritas. Nombra lo que arrojas."},{day:6,title:"Erev Kippur",desc:"Come con dulzura antes del ayuno. La mesa previa es mitzvá. Pide bendición a alguien."},{day:7,title:"Neila",desc:"Al cerrar, escribe una puerta que quieres que permanezca abierta este año."}]},{id:"januca-purim",num:6,titleEs:"Janucá y Purim",titleHeLatin:"Luz oculta y alegría",hebrew:"אור",hebrewFull:"חנוכה ופורים",tag:"Milagro pequeño",abierta:"Dos fiestas rabínicas: una de luz que resiste, otra de máscara que revela. Milagros pequeños. No mar abierto, aceite que dura. No profeta, risa que rompe decreto.",profunda:"Ner Ish UBeito - cada persona y su casa debe encender. No el templo, tu casa. Janucá es jinuja - inauguración: volver a inaugurar lo profanado. Meguilat Ester no nombra a Dios ni una vez: Dios oculto en intriga palaciega. Al HaNisim dice: bimeihem bazmán hazé - en sus días, en este tiempo. La luz de Janucá no se apaga porque es luz de lo poco que alcanza. Purim: ad delo yada - hasta no saber diferencia entre bendito Mordejai y maldito Haman, porque la alegría rompe categorías.",sources:["Shabat 21b — Ner Janucá","Meguilat Ester — hester panim","Al HaNisim — janucá y purim","Rambam Hiljot Meguilá 2:15 — Mishloaj Manot y Matanot"],practicaIntro:"Encender janukiá 8 días, dar Mishloaj Manot.",color:"#EDE6D1",practica7:[{day:1,title:"Ner 1",desc:"Enciende 1 vela hoy, aunque no sea Janucá. Di: pongo luz donde había costumbre."},{day:2,title:"Shemen",desc:"Busca tu aceite pequeño que aún dura: ¿Qué te queda cuando todo falta?"},{day:3,title:"Jalon",desc:"Pon tu janukiá en la ventana. Que tu luz sea vista. No escondas tu milagro."},{day:4,title:"Máscara",desc:"En Purim nos disfrazamos para revelar. ¿Qué máscara te permite decir la verdad?"},{day:5,title:"Mishloaj",desc:"Envía comida a alguien hoy. Dos porciones, a una persona. Sin motivo."},{day:6,title:"Matanot",desc:"Da a quien no puede devolverte. Ese es el corazón de Purim."},{day:7,title:"Hallel y risa",desc:"Lee Al HaNisim. Luego ríe 60 segundos a propósito. La risa rompe decretos."}]}],Al=[100,120,140,160];function mi(){let[e,n]=de.useState(0),[t,r]=de.useState(!1),[l,u]=de.useState(null),[o,i]=de.useState("abierta"),[a,c]=de.useState(""),[p,h]=de.useState(new Set),[m,S]=de.useState(null);de.useEffect(()=>{try{let s=localStorage.getItem("derej-moed-scale");if(s){let f=parseInt(s,10);if(!isNaN(f)&&f>=0&&f<4)n(f)}}catch{}},[]),de.useEffect(()=>{try{localStorage.setItem("derej-moed-scale",String(e))}catch{}document.documentElement.style.setProperty("--text-scale",String(Al[e]/100))},[e]);let k=de.useMemo(()=>{if(!a.trim())return Wl;let s=a.toLowerCase();return Wl.fil
