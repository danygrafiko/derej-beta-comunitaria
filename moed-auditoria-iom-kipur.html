A32",explicacion:"La boca corre más rápido que el corazón. Decir sin habitar la palabra.",preguntas:["¿Pienso antes de hablar?","¿Hablo rápido por ansiedad?","¿Hago promesas que no puedo sostener?"],adamAdama:"Palabra y Aliento",portal:"Aire"},{id:5,hebrew:"על חטא שחטאנו לפניך בגלוי ובסתר",spanish:"En público y en secreto",transliteracion:"BaGalui uVaSeter",categoria:"Ben Adam laJavero",color:"#B85C38",explicacion:"¿Mantengo la misma integridad cuando nadie mira? El Al Jet recuerda que también cuenta lo que ocurre en privado.",preguntas:["¿Actúo torpemente para llamar la atención?","¿Hago buenas acciones buscando que otros las vean?","¿Hay actos en privado que me avergonzarían?","¿Creo que Dios observa lo privado con amor?","¿Pienso que si nadie ve, no cuenta?"],adamAdama:"Aire y Palabra",portal:"Palabra"},{id:6,hebrew:"על חטא שחטאנו לפניך בגלוי עריות",spanish:"Conducta sexual impropia",transliteracion:"BeGilui Arayot",categoria:"Ben Adam leAtzmo",color:"#8B6E4E",explicacion:"La sexualidad es un vehículo espiritual cuando tiene marco. Sin marco, dispersa.",preguntas:["¿Descalifiqué la sexualidad como algo solo físico?","¿Entiendo su potencial de unión y santidad?"],adamAdama:"Cuerpo y Santidad",portal:"Tierra"},{id:7,hebrew:"על חטא שחטאנו לפניך בדבור פה",spanish:"Por medio del habla",transliteracion:"BeDibur Pe",categoria:"Ben Adam laJavero",color:"#2A5A4A",explicacion:"Las palabras crean mundos. También los destruyen. Cada palabra cruel es una mancha que queda en el aire.",preguntas:["¿Hablé con crueldad esta semana?","¿Compartí chismes o críticas destructivas?","¿Tuve charlas vacías sin propósito?","¿Cómo podría elevar a otros con mi aliento?"],adamAdama:"Palabra y Corazón",portal:"Aire"},{id:8,hebrew:"על חטא שחטאנו לפניך בדעת ובמרמה",spanish:"Con conocimiento y engaño",transliteracion:"BeDaat uVeMirma",categoria:"Ben Adam leAtzmo",color:"#C45A32",explicacion:"Saber la verdad y esconderla. Autoengaño refinado. Evadir el espíritu de la ley cumpliendo la letra.",preguntas:["¿Engañé a otros usando mi conocimiento?","¿Me autoengañé para no cambiar?","¿Evadí el espíritu de la ley?","¿Actué con bravuconería intelectual?"],adamAdama:"Mente y Verdad",portal:"Fuego"},{id:9,hebrew:"על חטא שחטאנו לפניך בהרהור הלב",spanish:"Pensamientos del corazón",transliteracion:"BeHirhur HaLev",categoria:"Ben Adam leAtzmo",color:"#8B6E4E",explicacion:"Lo que pienso en secreto me forma. No es solo lo que hago, es lo que cultivo adentro.",preguntas:["¿Cultivé pensamientos negativos sobre otros?","¿Fantaseé con lo que me daña?"],adamAdama:"Pensamiento y Corazón",portal:"Agua"},{id:10,hebrew:"על חטא שחטאנו לפניך בהונאת רע",spanish:"Agraviar al prójimo",transliteracion:"BeOnaat Rea",categoria:"Ben Adam laJavero",color:"#2A5A4A",explicacion:"Agraviar al prójimo puede ocurrir con palabras, trato, dinero o ventaja. La reparación comienza al reconocer el efecto concreto sobre la otra persona.",preguntas:["¿Dije o hice algo que disminuyó a otra persona?","¿Me aproveché de una diferencia de información, poder o dinero?","¿Hay una ofensa concreta que necesito reparar?"],adamAdama:"Vínculo y Pertenencia",portal:"Agua"},{id:11,hebrew:"על חטא שחטאנו לפניך בודוי פה",spanish:"Confesión sólo de palabra",transliteracion:"BeVidui Pe",categoria:"Ben Adam leAtzmo",color:"#C45A32",explicacion:"Decir perdón sin sentirlo. Prometer cambio sin querer cambiar. La confesión vacía es otra capa de distancia.",preguntas:["¿Pedí disculpas sin sinceridad?","¿Me comprometí a cambiar sin intención real?"],adamAdama:"Palabra y Verdad",portal:"Palabra"},{id:12,hebrew:"על חטא שחטאנו לפניך בועידת זנות",spanish:"Reuniones orientadas a conductas impropias",transliteracion:"BeVeidat Zenut",categoria:"Ben Adam laJavero",color:"#B85C38",explicacion:"Los ambientes que elegimos también nos forman. Participar en espacios que normalizan conductas degradantes puede arrastrarnos más lejos de nuestros valores.",preguntas:["¿Participé en un ambiente que normalizaba conductas que después lamenté?","¿Me dejé llevar por el grupo contra mis propios límites?","¿Qué entorno necesito evitar o elegir con más cuidado?"],adamAdama:"Grupo y Responsabilidad",portal:"Aire"},{id:13,hebrew:"על חטא שחטאנו לפניך בזדון ובשגגה",spanish:"Con intención o por descuido",transliteracion:"BeZadon uViShgaga",categoria:"Ben Adam leAtzmo",color:"#8B6E4E",explicacion:"A veces me rebelo solo para demostrar que soy libre. Otras, fallo por descuido evitable.",preguntas:["¿Me rebelé solo para mostrar independencia?","¿Cometí errores por despreocupación que podía evitar?"],adamAdama:"Voluntad y Límite",portal:"Fuego"},{id:14,hebrew:"על חטא שחטאנו לפניך בזלזול הורים ומורים",spanish:"Deshonra a padres y maestros",transliteracion:"BeZilzul Horim uMorim",categoria:"Ben Adam laJavero",color:"#2A5A4A",explicacion:"Honrar no es obedecer ciego. Es reconocer la fuente. Padres y maestros son canales de vida.",preguntas:["¿Pensé mal de mis padres esta semana?","¿Guardo resentimiento sin elaborar?","¿Expresé aprecio concreto?","¿Qué querría si yo fuera padre?","¿Atiendo a los mayores con paciencia?","¿Busco guía sabia o creo que ya sé?"],adamAdama:"Raíz y Transmisión",portal:"Tierra"},{id:15,hebrew:"על חטא שחטאנו לפניך בחוזק יד",spanish:"Uso de la fuerza",transliteracion:"BeJozek Yad",categoria:"Ben Adam laJavero",color:"#C45A32",explicacion:"Usar la fuerza que tengo — física, económica, emocional — para achicar a otro.",preguntas:["¿Saqué ventaja de alguien más débil?","¿Manipulé o intimidé para conseguir algo?"],adamAdama:"Poder y Justicia",portal:"Fuego"},{id:16,hebrew:"על חטא שחטאנו לפניך בחילול השם",spanish:"Profanación del Nombre",transliteracion:"BeJilul HaShem",categoria:"Ben Adam laMakom",color:"#8B6E4E",explicacion:"Cuando mi conducta contradice la santidad que digo representar, puedo profanar el Nombre; actuar con integridad apunta en la dirección contraria.",preguntas:["¿Actué de un modo irrespetuoso que deshonra?","¿Mi conducta dio una imagen pobre de la tradición que digo respetar?","¿Mi vida inspira Torá en otros?"],adamAdama:"Nombre y Presencia",portal:"Palabra"},{id:17,hebrew:"על חטא שחטאנו לפניך בטפשות פה",spanish:"Habla insensata",transliteracion:"BeTipshut Pe",categoria:"Ben Adam laMakom",color:"#2A5A4A",explicacion:"El tiempo se va en trivialidades. ¿Cuántas palabras de Torá dije hoy con presencia?",preguntas:["¿Cuánto tiempo perdí en lo trivial?","¿Podría poner una palabra de Torá en cada momento?"],adamAdama:"Tiempo y Palabra",portal:"Tiempo"},{id:18,hebrew:"על חטא שחטאנו לפניך בטומאת שפתים",spanish:"Labios impuros",transliteracion:"BeTumat Sefataim",categoria:"Ben Adam laMakom",color:"#B85C38",explicacion:"La boca es un Bet HaMikdash pequeño. Lo que sale de ella revela lo que hay dentro.",preguntas:["¿Contaminé mi boca con vulgaridad?","¿Me reí de bromas ofensivas?","¿Protesté cuando debía?","¿Cómo puedo expresarme mejor?"],adamAdama:"Boca y Santidad",portal:"Palabra"},{id:19,hebrew:"על חטא שחטאנו לפניך ביצר הרע",spanish:"Impulso al mal",transliteracion:"BeYetzer HaRa",categoria:"Ben Adam leAtzmo",color:"#C45A32",explicacion:"El impulso no es enemigo. Es energía sin dirección. La Torá enseña a canalizar, no a reprimir.",preguntas:["¿Busqué placeres mundanos sin dimensión espiritual?","¿Dije 'no pude evitarlo' como excusa?","¿Qué técnicas de Torá conozco para canalizar?"],adamAdama:"Deseo y Canal",portal:"Fuego"},{id:20,hebrew:"על חטא שחטאנו לפניך ביודעים ובלא יודעים",spanish:"Con conocimiento o sin él",transliteracion:"BeYodim uVelo Yodim",categoria:"Ben Adam laJavero",color:"#2A5A4A",explicacion:"Hay faltas que reconocemos y otras que todavía no vemos. No saberlo todo no elimina el efecto de nuestros actos; por eso la escucha y la humildad forman parte de la teshuvá.",preguntas:["¿Estoy dispuesto a escuchar si alguien me señala algo que no vi?","¿Hay patrones que otras personas perciben antes que yo?","¿Qué puedo revisar sin inventarme culpas por lo que desconozco?"],adamAdama:"Rostro y Sombra",portal:"Agua"},{id:21,hebrew:"על חטא שחטאנו לפניך בכפת שוחד",spanish:"Soborno",transliteracion:"BeKafat Shojad",categoria:"Ben Adam laJavero",color:"#8B6E4E",explicacion:"Comprometer la honestidad por dinero, honor o aprobación. Pequeñas corrupciones diarias.",preguntas:["¿Comprometí mi honestidad por dinero, honor o aprobación?"],adamAdama:"Dinero y Honestidad",portal:"Dinero"},{id:22,hebrew:"על חטא שחטאנו לפניך בכחש ובכזב",spanish:"Negación y falsedad",transliteracion:"BeKajash uVeJazav",categoria:"Ben Adam leAtzmo",color:"#B85C38",explicacion:"Mentir me vuelve menos confiable para mí mismo. La mentira 'inofensiva' corroe.",preguntas:["¿Mentí a otros o a mí mismo?","¿Mi trabajo me obliga a mentir?","¿Creo que hay mentiras inofensivas?"],adamAdama:"Verdad y Trabajo",portal:"Palabra"},{id:23,hebrew:"על חטא שחטאנו לפניך בלשון הרע",spanish:"Lashón hará · habla dañina",transliteracion:"BeLashon HaRa",categoria:"Ben Adam laJavero",color:"#C45A32",explicacion:"Disfrutar el chisme es una adicción espiritual. Reservar juicio es un músculo.",preguntas:["¿Disfruto escuchar chisme?","¿Acepto el chisme como verdad o reservo juicio?","¿Estudio las leyes de Lashón Hará?"],adamAdama:"Lengua y Juicio",portal:"Palabra"},{id:24,hebrew:"על חטא שחטאנו לפניך בלצון",spanish:"Burla y escarnio",transliteracion:"BeLatzon",categoria:"Ben Adam leAtzmo",color:"#2A5A4A",explicacion:"Burlarme de lo serio o del menos inteligente me hace sentir grande un segundo. Después, me achica.",preguntas:["¿Me burlé de asuntos serios?","¿Me burlé de alguien menos inteligente?","¿Deseché crítica constructiva por orgullo?"],adamAdama:"Humor y Humildad",portal:"Aire"},{id:25,hebrew:"על חטא שחטאנו לפניך במשא ובמתן",spanish:"Negocios y transacciones",transliteracion:"BeMasa uVeMatan",categoria:"Ben Adam laJavero",color:"#8B6E4E",explicacion:"Cómo gano dinero muestra cómo entiendo el mundo. ¿Es mi carrera un lugar con libertad espiritual?",preguntas:["¿Actué con honestidad en lo financiero esta semana?","¿Fui cruel con la competencia?","¿Mi carrera me da libertad espiritual?","¿Agradezco a Dios por el éxito?"],adamAdama:"Tiempo y Dinero",portal:"Dinero"},{id:26,hebrew:"על חטא שחטאנו לפניך במאכל ובמשתה",spanish:"Comida y bebida",transliteracion:"BeMaajal uVeMishte",categoria:"Ben Adam leAtzmo",color:"#B85C38",explicacion:"Comer puede ser mitzvá o acto animalístico. Todo depende de la conciencia.",preguntas:["¿Como para tener fuerza para mitzvot o por impulso?","¿Como haciendo otra cosa, sin presencia?","¿Cuido casher con alegría?","¿Agradezco antes y después?","¿Comí de más?","¿Comí algo que me daña?","¿Desperdicié comida?"],adamAdama:"Cuerpo y Gratitud",portal:"Tierra"},{id:27,hebrew:"על חטא שחטאנו לפניך בנשך ובמרבית",spanish:"Interés y usura",transliteracion:"BeNeshej uVeMarbit",categoria:"Ben Adam laJavero",color:"#C45A32",explicacion:"Ganar por el infortunio del otro. Codicia, tacañería y olvido de responsabilidad.",preguntas:["¿Gané dinero por el infortunio de otro?","¿Fui codicioso?","¿Fui tacaño cuando podía ayudar?","¿Entiendo mi responsabilidad de ayudar?","¿Conozco las leyes de usura?"],adamAdama:"Dinero y Responsabilidad",portal:"Dinero"},{id:28,hebrew:"על חטא שחטאנו לפניך בנטית גרון",spanish:"Altivez",transliteracion:"BeNetiat Garon",categoria:"Ben Adam leAtzmo",color:"#2A5A4A",explicacion:"Hacer sentir mal a otra persona para sentirme mejor. Hablar para llamar la atención. No dejar pasar primero.",preguntas:["¿Hice sentir mal a alguien para sentirme mejor?","¿Me visto o hablo buscando atención?","¿Dejo entrar primero por la puerta?"],adamAdama:"Ego y Puerta",portal:"Aire"},{id:29,hebrew:"על חטא שחטאנו לפניך בשיח שפתותינו",spanish:"Conversación vacía de nuestros labios",transliteracion:"BeSiaj Sefatoteinu",categoria:"Ben Adam laJavero",color:"#8B6E4E",explicacion:"La conversación vacía puede ocupar todo el espacio interior. El problema no es hablar mucho en sí, sino perder presencia, profundidad o cuidado en la palabra.",preguntas:["¿Llené el silencio sólo por incomodidad?","¿Hablé sin escuchar?","¿Qué conversa
